# Verifies a Claude review exists for the pull request's CURRENT head commit.
#
# The approval rule is "one human approval plus a passing agent review on every pull request".
# The human half is enforced by the branch ruleset. This is the other half.
#
# It does not read the review or judge what it found -- the judgement is in the review itself,
# posted by the /el-review skill in the approver's own session. This answers only "did one
# happen, for this commit".
#
# Binding it to the head commit is the whole point. A review of an earlier commit must not
# satisfy the check for code pushed afterwards, or you review once, push anything, and merge.
#
# ---------------------------------------------------------------------------
# CALLER REQUIREMENTS -- this needs more than the other reusable workflows
# ---------------------------------------------------------------------------
# The review is posted AFTER a pull_request-triggered run has already finished, so a caller
# that only triggers on pull_request will fail this check and never re-run it. The caller must
# also trigger on pull_request_review, and must grant statuses: write.
#
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened, ready_for_review]
#     pull_request_review:
#       types: [submitted]
#
#   jobs:
#     agent-review-check:
#       permissions:
#         contents: read
#         pull-requests: read
#         statuses: write
#       uses: EasyLife365/.github/.github/workflows/pr_agent_review.yml@main
#
# Two things about that snippet are deliberate and are not style.
#
# The job id is NOT `agent-review`. A caller job that can ever be skipped reports a check run
# under its bare job id, and GitHub counts a skipped check as passing -- so a job id equal to
# the required status context is a way for the gate to be satisfied with no work done.
#
# There is no `secrets: inherit`. This workflow declares no secrets and runs entirely on
# github.token. Inheriting would hand the caller's whole secret set to a job that needs none,
# and because callers reference this file unpinned, a step added here later would receive
# them without any caller-side change ever being reviewed.
#
# SAFETY CONSTRAINT FOR ANYONE EDITING THIS FILE: it must never check out the pull request
# head. pull_request_review runs in base-repo context with a write-capable token and the
# caller's inherited secrets; checking out and executing head content under that token is
# what makes pull_request_target dangerous, and it would make this workflow dangerous in
# exactly the same way. The only checkout below targets <owner>/.github on purpose.
#
# WHO CAN SATISFY THIS CHECK
#
# Only a REVIEW, only from OWNER / MEMBER / COLLABORATOR. Plain issue comments are not read.
# The author of a pull request may satisfy it on their own pull request; the status names who
# posted the marker so an approver can see that and re-run it if they want.
#
# It is not tamper-proof. Anyone with push access can post this status directly with their own
# token, because commit statuses carry no per-context write protection. The rules make the lazy
# path stop being the wrong path; they do not make the gate unforgeable.

# THE JOB'S COLOUR IS NOT THE CHECK'S ANSWER
#
# This job goes green whenever it managed to post a status, whatever that status says. The
# finding is in the status: red when no review exists for the head commit, green when one does.
#
# That split matters because a check run is never retracted. When the review lands, the
# pull_request_review run adds a SECOND check run of the same name -- so if the first run had
# failed on "no review yet", every pull request would permanently display a failing check beside
# an identically named passing one. Misleading, in the one place people look to judge whether a
# pull request is healthy.
#
# So the job fails only when it genuinely could not do its work: missing configuration, an
# unreachable API, a status that would not post.

# The ruleset requires the STATUS CONTEXT (`agent-review` by default), not this workflow's own
# check run. A run triggered by pull_request_review does not reliably attach its check to the
# pull request's head SHA, so a required check depending on that association would pass or fail
# against the wrong commit. The script posts an explicit status naming the SHA instead.

name: PR agent review

on:
  workflow_call:
    inputs:
      status-context:
        description: 'Commit status context to post. This is the name the branch ruleset requires -- change it in both places or not at all.'
        required: false
        type: string
        default: 'agent-review'
      exempt-authors:
        description: 'Comma-separated authors exempt from agent review. Bump and dependency pull requests are proven by CI, and reviewing a version-number diff is spend with nothing to find.'
        required: false
        type: string
        default: 'dependabot[bot],renovate[bot]'
      node-version:
        description: 'Node version used to run the check.'
        required: false
        type: string
        default: '24.x'

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  agent-review:
    name: Agent review
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # The script lives in this repository, not the one under review. job_workflow_sha pins it
      # to the same revision as this workflow, so a caller on an older ref keeps the behaviour
      # it was reviewed against.
      - name: Checkout shared scripts
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/.github
          ref: ${{ github.job_workflow_sha || 'main' }}
          path: .easylife-workflows
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}

      - name: Check for an agent review on the head commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Both trigger shapes carry the pull request, but under different keys.
          INPUT_PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_STATUS_CONTEXT: ${{ inputs.status-context }}
          INPUT_EXEMPT_AUTHORS: ${{ inputs.exempt-authors }}
        run: node .easylife-workflows/scripts/pr-agent-review.mjs
