name: React build

on:
  workflow_call:

    inputs:
      run-storybook:
        required: false
        type: boolean
        default: false

      publish:
        required: false
        type: boolean
        default: false

      yarn:
        required: false
        type: boolean
        default: false

    secrets:
      GITHUB_PACKAGE_TOKEN:
        required: false

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v7
        env:
          GITHUB_PACKAGE_TOKEN: ${{ secrets.GITHUB_PACKAGE_TOKEN }}
          # actions/setup-node@v7 always writes "_authToken=${NODE_AUTH_TOKEN}" into the generated
          # .npmrc, unlike v4 which only wrote it when the variable was set. It only re-exports
          # NODE_AUTH_TOKEN to later steps if it was already present when this step ran, so it has
          # to be set here for the yarn install path below, not only on the npm publish step further
          # down. Matches the same fix already applied in ci_react_build.yml/ci_react_unit_tests.yml.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_PACKAGE_TOKEN }}
        with:
          node-version: '24.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@easylife365'

      - name: Install Yarn v1
        if: ${{ inputs.yarn }}
        run: npm install -g yarn@1

      - name: Install dependencies
        if: ${{ inputs.yarn }}
        run: yarn install --frozen-lockfile
        env:
          GITHUB_PACKAGE_TOKEN: ${{ secrets.GITHUB_PACKAGE_TOKEN }}

      - name: Install Dependencies
        if: ${{ !inputs.yarn }}
        run: npm ci
        env:
          GITHUB_PACKAGE_TOKEN: ${{ secrets.GITHUB_PACKAGE_TOKEN }}

      # The unit suites gate a pull request through ci_react_unit_tests.yml, but nothing ran them on the
      # publish path -- so a library could ship to npm with a failing suite, and every product app consumes
      # these packages. They run here, before the version bump, so a failure costs nothing downstream.
      #
      # Detected rather than driven by an input: a consumer cannot forget to opt in, and a repository with
      # no `test` script is skipped instead of failing.
      - name: Detect unit test script
        id: unit-tests
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'No "test" script in package.json; skipping unit tests.'
          fi

      - name: Unit tests (npm)
        if: ${{ steps.unit-tests.outputs.present == 'true' && !inputs.yarn }}
        run: npm test
        env:
          GITHUB_PACKAGE_TOKEN: ${{ secrets.GITHUB_PACKAGE_TOKEN }}

      - name: Unit tests (yarn)
        if: ${{ steps.unit-tests.outputs.present == 'true' && inputs.yarn }}
        run: yarn test
        env:
          GITHUB_PACKAGE_TOKEN: ${{ secrets.GITHUB_PACKAGE_TOKEN }}

      - uses: EasyLife365/get-version-action@v1.2.0
        if: ${{ inputs.publish }}
        id: version

      - name: Set version (npm)
        if: ${{ inputs.publish && !inputs.yarn }}
        run: npm version ${{ steps.version.outputs.versionWithoutV }} --no-git-tag-version

      - name: Set version (yarn)
        if: ${{ inputs.publish && inputs.yarn }}
        run: yarn version --new-version ${{ steps.version.outputs.versionWithoutV }} --no-git-tag-version
        env:
          GITHUB_PACKAGE_TOKEN: ${{ secrets.GITHUB_PACKAGE_TOKEN }}

      - name: Build (npm)
        if: ${{ !inputs.yarn }}
        run: npm run build --if-present
        env:
          GITHUB_PACKAGE_TOKEN: ${{ secrets.GITHUB_PACKAGE_TOKEN }}

      - name: Build (yarn)
        if: ${{ inputs.yarn }}
        run: yarn build
        env:
          GITHUB_PACKAGE_TOKEN: ${{ secrets.GITHUB_PACKAGE_TOKEN }}

      - name: Install Playwright
        if: ${{ inputs.run-storybook }}
        run: npx playwright install --with-deps

      - name: Build Storybook (npm)
        if: ${{ inputs.run-storybook && !inputs.yarn }}
        run: npm run storybook:export
        env:
          GITHUB_PACKAGE_TOKEN: ${{ secrets.GITHUB_PACKAGE_TOKEN }}

      - name: Build Storybook (yarn)
        if: ${{ inputs.run-storybook && inputs.yarn }}
        run: yarn storybook:export
        env:
          GITHUB_PACKAGE_TOKEN: ${{ secrets.GITHUB_PACKAGE_TOKEN }}

      - name: Serve Storybook and run tests (npm)
        if: ${{ inputs.run-storybook && !inputs.yarn }}
        run: |
          npx concurrently -k -s first -n "SB,TEST" -c "magenta,blue" \
            "npx http-server storybook-static --port 6006 --silent" \
            "npx wait-on tcp:127.0.0.1:6006 && npm run test-coverage"
        env:
          GITHUB_PACKAGE_TOKEN: ${{ secrets.GITHUB_PACKAGE_TOKEN }}

      - name: Serve Storybook and run tests (yarn)
        if: ${{ inputs.run-storybook && inputs.yarn }}
        run: |
          npx concurrently -k -s first -n "SB,TEST" -c "magenta,blue" \
            "npx http-server storybook-static --port 6006 --silent" \
            "npx wait-on tcp:127.0.0.1:6006 && yarn test-coverage"
        env:
          GITHUB_PACKAGE_TOKEN: ${{ secrets.GITHUB_PACKAGE_TOKEN }}

      - uses: dorny/test-reporter@v3
        if: always() && inputs.run-storybook
        with:
          name: Test Details                 
          path: junit.xml                     
          reporter: jest-junit

      # A release of an older line (a hotfix tagged vX.Y.N from hotfix/vX.Y.N) must never become the npm
      # `latest`: npm moves `latest` to whatever was published last. So the version being published is
      # compared with the current `latest` of the package first. Greater than latest (or no latest yet):
      # plain `npm publish`, it becomes `latest` as before. Equal or lower: published with
      # `--tag maint-<MAJOR>.<MINOR>`, which leaves `latest` alone. A registry lookup that fails for any
      # reason other than "package not found" fails the job, so nothing is ever published blindly.
      #
      # The comparison is dependency-free (node only, no download in a publishing job) and follows SemVer
      # 2.0.0 section 11 for pre-releases. Build metadata cannot occur: the validation below rejects `+`.
      # Caller and tag values reach the shell only through env: and are validated before use.
      - name: Publish packages
        if: ${{ inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail

          fail() { echo "::error::$1"; exit 1; }

          version_re='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          name_re='^(@[a-z0-9._~-]+/)?[a-z0-9._~-]+$'

          [[ "$PKG_VERSION" =~ $version_re ]] || fail "Refusing to publish: version '$PKG_VERSION' is not MAJOR.MINOR.PATCH[-prerelease]."

          pkg_name="$(node -p "require('./package.json').name")"
          [[ "$pkg_name" =~ $name_re ]] || fail "Refusing to publish: package name '$pkg_name' is not a valid npm package name."

          err_file="$(mktemp)"
          if latest="$(npm view "$pkg_name" dist-tags.latest --registry "$REGISTRY" 2>"$err_file")"; then
            latest="${latest//[$'\r\n']/}"
          elif grep -q 'E404' "$err_file"; then
            latest=""
          else
            cat "$err_file"
            fail "Could not read the current latest of $pkg_name from $REGISTRY. Not publishing under an unknown tag."
          fi

          if [ -n "$latest" ] && ! [[ "$latest" =~ $version_re ]]; then
            fail "The registry returned '$latest' as latest of $pkg_name, which is not a version. Not publishing."
          fi

          if [ -z "$latest" ]; then
            result=greater
            reason="$pkg_name has no latest yet (first publish)."
          else
            result="$(node -e '
              const parse = (v) => {
                const [core, pre] = v.split(/-(.+)/);
                return { n: core.split(".").map(Number), pre: pre ? pre.split(".") : [] };
              };
              const isNum = (s) => /^[0-9]+$/.test(s);
              const cmpId = (a, b) => {
                if (isNum(a) && isNum(b)) return Math.sign(Number(a) - Number(b));
                if (isNum(a)) return -1;
                if (isNum(b)) return 1;
                return a < b ? -1 : a > b ? 1 : 0;
              };
              const cmp = (x, y) => {
                const a = parse(x), b = parse(y);
                for (let i = 0; i < 3; i++) if (a.n[i] !== b.n[i]) return a.n[i] > b.n[i] ? 1 : -1;
                if (!a.pre.length && !b.pre.length) return 0;
                if (!a.pre.length) return 1;
                if (!b.pre.length) return -1;
                for (let i = 0; i < Math.max(a.pre.length, b.pre.length); i++) {
                  if (a.pre[i] === undefined) return -1;
                  if (b.pre[i] === undefined) return 1;
                  const c = cmpId(a.pre[i], b.pre[i]);
                  if (c !== 0) return c;
                }
                return 0;
              };
              console.log(cmp(process.argv[1], process.argv[2]) > 0 ? "greater" : "not-greater");
            ' "$PKG_VERSION" "$latest")"
            if [ "$result" = greater ]; then
              reason="$PKG_VERSION is greater than the current latest $latest."
            else
              reason="$PKG_VERSION is not greater than the current latest $latest."
            fi
          fi

          case "$result" in
            greater)
              tag=latest
              npm publish
              ;;
            not-greater)
              major_minor="${PKG_VERSION%%.*}.$(echo "$PKG_VERSION" | cut -d. -f2)"
              tag="maint-$major_minor"
              [[ "$tag" =~ ^maint-[0-9]+\.[0-9]+$ ]] || fail "Refusing to publish: computed dist-tag '$tag' is malformed."
              npm publish --tag "$tag"
              ;;
            *)
              fail "Unexpected comparison result '$result'. Not publishing."
              ;;
          esac

          {
            echo "### npm publish"
            echo "- Package: \`$pkg_name\` version \`$PKG_VERSION\`"
            echo "- Dist-tag: \`$tag\`"
            echo "- Why: $reason"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          PKG_VERSION: ${{ steps.version.outputs.versionWithoutV }}
          REGISTRY: https://npm.pkg.github.com
          GITHUB_PACKAGE_TOKEN: ${{ secrets.GITHUB_PACKAGE_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_PACKAGE_TOKEN }}

