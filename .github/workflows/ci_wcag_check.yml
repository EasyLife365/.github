name: WCAG accessibility check

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: "24.x"
      checkout-ref:
        description: The head commit of the pull request to check out, github.event.pull_request.head.sha (any other value is refused). Needed only by a
          caller using pull_request_target (which otherwise leaves github.sha resolving to the
          BASE branch, not the pull request being checked) -- leave empty for the normal
          push/pull_request case.
        required: false
        type: string
        default: ''
    secrets:
      GITHUB_PACKAGE_TOKEN:
        required: false
      GITHUB_PACKAGE_TOKEN_READONLY:
        description: 'A read:packages-only token, used instead of GITHUB_PACKAGE_TOKEN whenever checkout-ref is set -- that path checks out real, unreviewed Dependabot/Renovate content earlier in this job, which should never share a job with a credential that can also publish. Optional: falls back to GITHUB_PACKAGE_TOKEN if not provided, so an existing caller with no readonly token configured keeps working exactly as before, just without this extra separation until it adds one.'
        required: false

permissions:
  contents: read

jobs:
  wcag-check:
    name: WCAG 2.1 Compliance
    runs-on: ubuntu-latest

    steps:
      # checkout-ref makes this job check out a pull request's own code in a pull_request_target
      # run, which holds secrets, so it is accepted only for a bot's own pull request. github.actor
      # alone does not prove that: it is whoever caused the event, which an outsider can arrange to be
      # dependabot[bot] (Dependabot updating a branch of their fork), and a re-run keeps it. The author
      # of the pull request, the repository its branch lives in and its head commit cannot be set by
      # anyone else. Every value reaches the shell through env:, never as an expression inside run:,
      # so no value can become shell code (EasyLife365/.github#191).
      - name: Refuse checkout-ref for anyone but an allow-listed bot
        if: ${{ inputs.checkout-ref != '' }}
        shell: bash
        env:
          CHECKOUT_REF: ${{ inputs.checkout-ref }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          is_bot() { [ "$1" = 'dependabot[bot]' ] || [ "$1" = 'renovate[bot]' ]; }
          # Only GitHub-made values (event name, logins, repository names) are printed, never
          # checkout-ref itself, so the message cannot carry a workflow command.
          reason=''
          if [ "$EVENT_NAME" != 'pull_request_target' ]; then
            reason="the event is $EVENT_NAME, not pull_request_target"
          elif ! is_bot "$PR_AUTHOR"; then
            reason="the pull request was opened by '$PR_AUTHOR', not by dependabot[bot] or renovate[bot]"
          elif ! is_bot "$ACTOR"; then
            reason="the event was caused by '$ACTOR', not by dependabot[bot] or renovate[bot]"
          elif [ "$PR_HEAD_REPO" != "$REPOSITORY" ]; then
            reason="the pull request branch lives in '$PR_HEAD_REPO', not in '$REPOSITORY'"
          elif [ "$CHECKOUT_REF" != "$PR_HEAD_SHA" ]; then
            reason='checkout-ref is not the head commit of the pull request'
          fi
          if [ -n "$reason" ]; then
            echo "::error::Refusing to check out checkout-ref: $reason."
            exit 1
          fi
          echo "checkout-ref accepted: the head commit of a pull request opened by $PR_AUTHOR in $REPOSITORY."

      # persist-credentials left at its default (true), unlike the other files touched in the same
      # change: "Fetch base branch" below runs a raw `git fetch origin <base>` and needs the
      # credential this checkout persists to authenticate it, or it fails with "could not read
      # Username for 'https://github.com'" -- confirmed live, this job broke for every caller the
      # moment persist-credentials: false was added here. Safe to leave persisted: this job's own
      # permissions are contents: read only (top of this file) -- no checks:write or pull-requests:write
      # to forge, unlike ci_dotnet.yml/ci_react_unit_tests.yml/ci_react_storybook_tests.yml, where
      # persist-credentials: false actually closes something.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}

      # No --depth here: the checkout above is a full clone, and a --depth fetch into a full clone
      # makes it shallow again, cutting the parents of the fetched base tip. When the base branch
      # moved after GitHub built the PR merge commit, origin/<base> and HEAD then shared no commit
      # and the diff below stopped with "no merge base" (exit 128, EasyLife365/.github#189).
      - name: Fetch base branch
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      - name: Checkout shared WCAG script
        uses: actions/checkout@v7
        with:
          repository: EasyLife365/.github
          ref: main
          path: .shared-github
          token: ${{ (inputs.checkout-ref != '' && secrets.GITHUB_PACKAGE_TOKEN_READONLY) || secrets.GITHUB_PACKAGE_TOKEN || github.token }}
          persist-credentials: false
          sparse-checkout: |
            scripts/check-wcag.mjs

      - name: Run WCAG check on changed files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # BASE is the commit the changes are measured from; the files checked are those changed
          # between the merge base of BASE and HEAD, and HEAD (what "BASE...HEAD" means).
          BASE=""
          if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "pull_request_target" ]; then
            BASE="origin/$BASE_REF"
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            # merge_group.base_sha is a real commit on the default branch, which the full checkout
            # (fetch-depth: 0) already holds: no "Fetch base branch" step needed for it.
            BASE="$MERGE_GROUP_BASE_SHA"
          elif [ "$EVENT_NAME" = "push" ]; then
            if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
              BASE="$BEFORE_SHA"
            elif git rev-parse --verify --quiet HEAD~1 >/dev/null; then
              BASE="HEAD~1"
            fi
          else
            echo "Unsupported event: $EVENT_NAME"
            exit 1
          fi

          # git's own message on a failed merge-base is kept in $MERGE_BASE_ERR for the warning below
          # (a file, because find_merge_base runs in a command substitution's subshell).
          MERGE_BASE_ERR=$(mktemp)
          find_merge_base() { git merge-base --end-of-options "$BASE" HEAD 2>"$MERGE_BASE_ERR"; }

          MERGE_BASE=""
          if [ -n "$BASE" ]; then
            MERGE_BASE=$(find_merge_base) || MERGE_BASE=""
            if [ -z "$MERGE_BASE" ] && [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
              echo "No merge base between $BASE and HEAD in a shallow history; fetching the full history."
              git fetch --no-tags --unshallow origin || true
              MERGE_BASE=$(find_merge_base) || MERGE_BASE=""
            fi
          fi

          # :(glob) makes "**/" match zero or more folders, so src/App.tsx is checked as well as
          # src/components/Button.tsx; a plain 'src/**/*.tsx' needs at least one folder below src/.
          PATHSPEC=(':(glob)src/**/*.tsx' ':(glob)src/**/*.css')
          # The list is NUL-separated (-z) and read into an array, so a path with a space, an
          # umlaut or a glob character reaches the checker as it is: never C-quoted by git
          # (core.quotepath=false, and -z never quotes), never split or expanded by the shell.
          # It goes through a file, not a process substitution, so a failing git fails this step.
          FILE_LIST=$(mktemp)

          if [ -n "$MERGE_BASE" ]; then
            echo "Checking files changed since $MERGE_BASE (merge base of $BASE and HEAD)."
            git -c core.quotepath=false diff -z --name-only --diff-filter=d "$MERGE_BASE" HEAD -- "${PATHSPEC[@]}" >"$FILE_LIST"
          else
            # Never fail on git history: no base commit (a first commit) or no merge base (base
            # commit gone after a force push, unrelated histories) means "changed files" cannot be
            # known, so every TSX/CSS file is checked instead. Stricter, never weaker.
            if [ -z "$BASE" ]; then
              REASON="There is no base commit to compare with (a first commit)"
            else
              REASON="No merge base found between '$BASE' and HEAD"
            fi
            echo "::warning title=WCAG check::$REASON, so the changed files cannot be worked out. Checking every src TSX/CSS file instead."
            if [ -s "$MERGE_BASE_ERR" ]; then
              echo "git merge-base said: $(head -c 300 "$MERGE_BASE_ERR" | tr '\n' ' ')"
            fi
            git -c core.quotepath=false ls-files -z -- "${PATHSPEC[@]}" >"$FILE_LIST"
          fi

          mapfile -d '' -t FILES <"$FILE_LIST"
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No changed TSX/CSS files to check."
            exit 0
          fi

          echo "Checking ${#FILES[@]} file(s)."
          node .shared-github/scripts/check-wcag.mjs "${FILES[@]}"
