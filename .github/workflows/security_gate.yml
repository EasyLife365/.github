name: Security gate

# Reusable security gate for every EasyLife 365 repository.
#
#   secret scan          a pull request's commits; the whole history on a schedule or a manual
#                        run with full-history, which is how a secret that predates this
#                        workflow gets found
#   .NET dependencies    Critical or High advisories in the solution's package graph
#   npm dependencies     High or Critical advisories in the production dependencies of the yarn
#                        workspace, or of the repository's npm package-lock.json
#   .NET licences        the licence of every package in the solution's graph, against
#                        licence-policy/policy.json in this repository
#   npm licences         the same for the repository's production dependencies, or everything installed
#                        in a workspace
#
# Called from each repository's .github/workflows/security.yml. The file name differs from the
# caller's on purpose: in this repository the two would otherwise collide on one path, and the
# caller would silently replace the definition every other repository depends on.
#
# Caller:
#
#   jobs:
#     call-security:
#       uses: EasyLife365/.github/.github/workflows/security_gate.yml@main
#       with:
#         dotnet-solution: EL.Core.sln
#       secrets:
#         package-token: ${{ secrets.PACKAGE_TOKEN }}
#
# A repository with a package-lock.json instead of a yarn.lock sets node-package-manager. A frontend in
# a subfolder sets node-working-directory to the folder that holds the lockfile:
#
#       with:
#         node: true
#         node-package-manager: npm
#         node-working-directory: EL.Onboarding
#
# The licence checks run whenever dotnet-solution is set or node is true, and REPORT ONLY: findings
# appear as warnings and in the job summary, and never fail the gate. Pass `licence-enforce: true` to
# fail on forbidden licences (unknown ones are only warned about), or `licence-check: false` to skip
# them. Packages that were reviewed can be listed in .licenceignore on the default branch. The policy
# and the format of that file are described in the "Security gate" section of this repository's readme.
#
# Stage 0a of the upgrade plan introduces it as a visible check; Stage 2 makes it required.

on:
  workflow_call:
    inputs:
      full-history:
        description: Scan the whole history for secrets instead of only a pull request's commits. Set by a manual run.
        required: false
        type: boolean
        default: false
      dotnet-solution:
        description: Solution to scan for vulnerable packages. Empty skips the .NET job.
        required: false
        type: string
        default: ''
      dotnet-version:
        required: false
        type: string
        default: '10.x'
      node:
        description: Run an advisory audit (and, with licence-check, a licence check) of the npm dependencies, with the package manager node-package-manager names.
        required: false
        type: boolean
        default: false
      node-package-manager:
        description: 'yarn (yarn.lock, yarn v1) or npm (package-lock.json). Anything else fails the job. Both audit production dependencies only, with an install that runs no scripts.'
        required: false
        type: string
        default: yarn
      node-working-directory:
        description: Folder, relative to the repository root, that holds the lockfile and package.json. Defaults to the root. The folder is a trusted caller input, never pull request content.
        required: false
        type: string
        default: .
      node-version:
        required: false
        type: string
        default: '24.x'
      licence-check:
        description: Check the licences of the .NET and npm dependencies. Runs the jobs that dotnet-solution and node already select.
        required: false
        type: boolean
        default: true
      licence-enforce:
        description: Fail the licence jobs on a forbidden licence, or when the scan produced no listing. Unknown licences only warn. By default the jobs only report (warnings and the job summary).
        required: false
        type: boolean
        default: false
      checkout-ref:
        description: Ref to check out, e.g. github.event.pull_request.head.sha. Needed only by a
          caller using pull_request_target (which otherwise leaves github.sha resolving to the
          BASE branch, not the pull request being scanned) -- leave empty for the normal
          push/pull_request case.
        required: false
        type: string
        default: ''
    secrets:
      package-token:
        description: GitHub Packages token used to restore private EL.* and @easylife365 packages.
        required: false
      package-token-readonly:
        description: 'A read-only token, used instead of package-token whenever checkout-ref is set -- that path scans real, unreviewed Dependabot/Renovate content, which should never be able to reach a credential that can also publish. Optional: falls back to package-token if not provided, so an existing caller with no readonly token configured keeps working exactly as before, just without this extra separation until it adds one. The licence jobs use it whenever it is provided, with or without checkout-ref, since they only read packages.'
        required: false

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Refuse checkout-ref for anyone but an allow-listed bot
        if: ${{ inputs.checkout-ref != '' && github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]' }}
        env:
          CHECKOUT_REF: ${{ inputs.checkout-ref }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "::error::checkout-ref was passed ('${CHECKOUT_REF}') but actor '${ACTOR}' is not dependabot[bot] or renovate[bot]. Refusing to check out that ref rather than trust a caller-side actor gate that this workflow cannot see or verify."
          exit 1

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # A repository can list paths the scan skips (regular expressions, one per line) in
      # .trufflehogignore -- for recorded API responses and similar fixtures that only look like
      # secrets. The list is read from the DEFAULT BRANCH, never from the checkout being scanned:
      # otherwise a pull request could add `.*` and hide its own secrets from its own scan. So a
      # new entry takes effect once it is merged. Without the file, nothing is excluded.
      # A listed path is skipped in every scan, including full-history ones, and a pattern matches
      # anywhere in a path. Anchor each entry (^path/to/file\.json$) and keep it as narrow as the
      # fixture it covers: a loose one such as `fixtures/` also hides every later file under it.
      # Treat any new or edited entry in a pull request as security-relevant.
      - name: Read the secret-scan exclusions from the default branch
        id: exclude
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || github.ref_name }}
        run: |
          # The fully qualified ref: `origin/<branch>` alone would let a pushed tag of that name
          # win, because git resolves tags before remote-tracking branches.
          # The file goes inside .git so it is neither scanned nor tracked, and so it sits under
          # the workspace the TruffleHog container mounts. \r and trailing blanks are stripped,
          # since TruffleHog takes every line literally and a CRLF would stop a pattern matching.
          # A schedule payload carries no repository, so the branch falls back to the ref the run is on,
          # which for a schedule is the default branch. show-ref checks the exact ref first, so a
          # missing branch is reported as such and never resolved to some other ref.
          if ! git show-ref --verify --quiet "refs/remotes/origin/${DEFAULT_BRANCH}"; then
            echo "::warning::No refs/remotes/origin/${DEFAULT_BRANCH} in this checkout; scanning every path."
            echo "args=" >> "$GITHUB_OUTPUT"
          elif git show "refs/remotes/origin/${DEFAULT_BRANCH}:.trufflehogignore" 2>/dev/null | sed -e 's/\r$//' -e 's/[[:space:]]*$//' > .git/trufflehog-exclude \
            && [ -s .git/trufflehog-exclude ]; then
            echo "Excluding the paths listed in .trufflehogignore on ${DEFAULT_BRANCH} from the scan."
            echo "args=--exclude-paths=.git/trufflehog-exclude" >> "$GITHUB_OUTPUT"
          else
            echo "No .trufflehogignore on ${DEFAULT_BRANCH}; scanning every path."
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      # merge_group is checked first and separately, rather than folded into the pull_request /
      # pull_request_target clause: it has its own event fields (merge_group.base_sha/head_sha),
      # not github.event.pull_request.*, which would be unset and silently collapse this to '' --
      # a full scan instead of a diff, same as no restriction at all.
      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          base: ${{ (github.event_name == 'merge_group' && !inputs.full-history) && github.event.merge_group.base_sha || (((github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && !inputs.full-history) && github.event.pull_request.base.sha) || '' }}
          head: ${{ (github.event_name == 'merge_group' && !inputs.full-history) && github.event.merge_group.head_sha || (((github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && !inputs.full-history) && github.event.pull_request.head.sha) || '' }}
          extra_args: --results=verified,unknown ${{ steps.exclude.outputs.args }}

  dotnet-dependencies:
    name: .NET dependencies
    if: inputs.dotnet-solution != ''
    runs-on: ubuntu-latest
    env:
      GITHUB_PACKAGE_USER_NAME: github-actions
      GITHUB_PACKAGE_TOKEN: ${{ (inputs.checkout-ref != '' && secrets.package-token-readonly) || secrets.package-token }}
    steps:
      - name: Refuse checkout-ref for anyone but an allow-listed bot
        if: ${{ inputs.checkout-ref != '' && github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]' }}
        env:
          CHECKOUT_REF: ${{ inputs.checkout-ref }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "::error::checkout-ref was passed ('${CHECKOUT_REF}') but actor '${ACTOR}' is not dependabot[bot] or renovate[bot]. Refusing to check out that ref rather than trust a caller-side actor gate that this workflow cannot see or verify."
          exit 1

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Restore
        run: dotnet restore "${{ inputs.dotnet-solution }}"

      - name: List vulnerable packages
        run: |
          dotnet list "${{ inputs.dotnet-solution }}" package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -qE '\b(Critical|High)\b' vulnerable.txt; then
            echo "::error::Critical or High vulnerabilities in the .NET package graph. See the list above."
            exit 1
          fi

  node-dependencies:
    name: npm dependencies
    if: inputs.node
    runs-on: ubuntu-latest
    env:
      # --ignore-scripts below already stops a malicious lockfile entry from running a postinstall
      # hook against this token; the readonly split is still applied for defence in depth and
      # consistency with the other jobs in this file.
      GITHUB_PACKAGE_TOKEN: ${{ (inputs.checkout-ref != '' && secrets.package-token-readonly) || secrets.package-token }}
    steps:
      - name: Refuse checkout-ref for anyone but an allow-listed bot
        if: ${{ inputs.checkout-ref != '' && github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]' }}
        env:
          CHECKOUT_REF: ${{ inputs.checkout-ref }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "::error::checkout-ref was passed ('${CHECKOUT_REF}') but actor '${ACTOR}' is not dependabot[bot] or renovate[bot]. Refusing to check out that ref rather than trust a caller-side actor gate that this workflow cannot see or verify."
          exit 1

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          persist-credentials: false

      - name: Check the package manager
        env:
          PACKAGE_MANAGER: ${{ inputs.node-package-manager }}
        run: |
          if [ "${PACKAGE_MANAGER}" != "yarn" ] && [ "${PACKAGE_MANAGER}" != "npm" ]; then
            echo "::error::node-package-manager must be 'yarn' or 'npm', not '${PACKAGE_MANAGER}'."
            exit 1
          fi

      # No `cache: yarn` or `cache: npm`: a PR or merge-queue ref cannot reuse another one's cache, so every run
      # saved its own ~1.4 GB copy that rarely hit, filling the 10 GB repo quota and evicting useful caches (#153).
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install without running scripts
        if: inputs.node-package-manager == 'yarn'
        working-directory: ${{ inputs.node-working-directory }}
        run: yarn install --frozen-lockfile --ignore-scripts

      # yarn v1 returns a bit mask: 1 info, 2 low, 4 moderate, 8 high, 16 critical.
      - name: Audit
        if: inputs.node-package-manager == 'yarn'
        working-directory: ${{ inputs.node-working-directory }}
        run: |
          set +e
          yarn audit --level high --groups dependencies
          code=$?
          set -e
          if [ "$code" -ge 8 ]; then
            echo "::error::High or Critical advisories in the npm dependency graph. See the audit above."
            exit 1
          fi

      # npm ci installs exactly package-lock.json and fails when package.json disagrees with it.
      - name: Install without running scripts (npm)
        if: inputs.node-package-manager == 'npm'
        working-directory: ${{ inputs.node-working-directory }}
        run: npm ci --ignore-scripts --no-audit --no-fund

      # The same rule as the yarn audit: High or Critical in production dependencies fail, dev-only
      # advisories and anything below High do not. npm audit exits 1 when it finds one at or above the
      # level, and also when the advisory service cannot be reached, so an outage fails the job rather
      # than passing unchecked; the output above says which of the two it was.
      - name: Audit (npm)
        if: inputs.node-package-manager == 'npm'
        working-directory: ${{ inputs.node-working-directory }}
        run: npm audit --audit-level=high --omit=dev

  # The licence jobs are separate from the advisory jobs above on purpose: a licence finding must not
  # turn ".NET dependencies" or "npm dependencies" red, and while the checks only report, nothing
  # they do (a tool failure, an unreachable feed) may block a pull request either, hence
  # continue-on-error unless the caller opted in to enforcing.
  #
  # The policy and the reporter live in this repository, not in the one being scanned, so they are
  # checked out at the commit of this workflow file (see pr_compliance.yml for why job.workflow_sha
  # and not github.workflow_sha). Both tools are pinned: nuget-license by version below, and the
  # npm lister by tools/licence-checker/package-lock.json, installed with `npm ci --ignore-scripts`
  # so its own dependencies cannot drift or run an install script. Dependabot tracks that directory;
  # nuget-license has no manifest to track, so bump it here by hand.
  #
  # The package token is given to the restore and install steps only, and it is the read-only one
  # whenever it exists: these jobs only read packages, and the steps that run the tools and the
  # reporter (which run code from the scanned dependency graph's metadata) never see it.
  #
  # Exclusions are read from .licenceignore on the DEFAULT BRANCH through the API, never from the
  # checkout being scanned, for the same reason as .trufflehogignore above: a pull request could
  # otherwise add `*` and hide its own findings from its own scan. The API is asked without a ref, so
  # it answers for the repository's default branch and a pushed tag or branch name cannot stand in
  # for it. A new entry takes effect once it is merged. One package per line, `*` is the wildcard,
  # `name@version` pins one version, `#` starts a comment. Without the file nothing is excluded.
  # Keep each entry as narrow as the package it covers and treat any new or edited entry in a pull
  # request as review-relevant.
  dotnet-licences:
    name: .NET licences
    if: inputs.licence-check && inputs.dotnet-solution != ''
    runs-on: ubuntu-latest
    continue-on-error: ${{ !inputs.licence-enforce }}
    steps:
      - name: Refuse checkout-ref for anyone but an allow-listed bot
        if: ${{ inputs.checkout-ref != '' && github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]' }}
        env:
          CHECKOUT_REF: ${{ inputs.checkout-ref }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "::error::checkout-ref was passed ('${CHECKOUT_REF}') but actor '${ACTOR}' is not dependabot[bot] or renovate[bot]. Refusing to check out that ref rather than trust a caller-side actor gate that this workflow cannot see or verify."
          exit 1

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          persist-credentials: false

      - name: Checkout the licence policy and reporter
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .easylife-workflows
          sparse-checkout: |
            licence-policy
            scripts
            tools
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}

      - name: Read the licence exclusions from the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # No ref: the contents API then answers for the default branch. The raw media type returns
          # the file itself. 404 is the normal "no file" answer; any other failure is reported and
          # treated as no exclusions, which can only add findings.
          if gh api --method GET "repos/${REPOSITORY}/contents/.licenceignore" \
              -H "Accept: application/vnd.github.raw" > "${RUNNER_TEMP}/licenceignore" 2> "${RUNNER_TEMP}/licenceignore.err"; then
            echo "Excluding the packages listed in .licenceignore on the default branch."
          else
            if ! grep -q "404" "${RUNNER_TEMP}/licenceignore.err"; then
              echo "::warning::Could not read .licenceignore on the default branch; excluding nothing."
            else
              echo "No .licenceignore on the default branch; excluding nothing."
            fi
            : > "${RUNNER_TEMP}/licenceignore"
          fi

      - name: Restore
        env:
          GITHUB_PACKAGE_USER_NAME: github-actions
          GITHUB_PACKAGE_TOKEN: ${{ secrets.package-token-readonly || secrets.package-token }}
          SOLUTION: ${{ inputs.dotnet-solution }}
        run: dotnet restore "${SOLUTION}"

      - name: List the licences
        env:
          SOLUTION: ${{ inputs.dotnet-solution }}
        run: |
          # The tool comes from nuget.org only, never from the caller's nuget.config, which lists
          # private feeds and could name a feed that serves a different package of the same name.
          cat > "${RUNNER_TEMP}/nuget.config" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          EOF
          dotnet tool install nuget-license --version 4.0.18 --tool-path "${RUNNER_TEMP}/tools" --configfile "${RUNNER_TEMP}/nuget.config"
          # The tool's exit code is the number of packages it could not validate, and the listing is
          # complete either way: the verdict is made by the reporter below, from the policy file.
          # Passing the allowed list keeps the tool from dropping packages it cannot classify itself.
          allowed="$(node -p "require('./.easylife-workflows/licence-policy/policy.json').allowed.join(';')")"
          "${RUNNER_TEMP}/tools/nuget-license" -i "${SOLUTION}" -t -a "${allowed}" -o Json -fo "${RUNNER_TEMP}/licences.json" || echo "nuget-license exited with $?"

      - name: Report
        env:
          LICENCE_ENFORCE: ${{ inputs.licence-enforce }}
        run: |
          node .easylife-workflows/scripts/licence-report.mjs --ecosystem dotnet --title ".NET licences" \
            --input "${RUNNER_TEMP}/licences.json" --policy .easylife-workflows/licence-policy/policy.json \
            --ignore "${RUNNER_TEMP}/licenceignore" --enforce "${LICENCE_ENFORCE}"

  node-licences:
    name: npm licences
    if: inputs.licence-check && inputs.node
    runs-on: ubuntu-latest
    continue-on-error: ${{ !inputs.licence-enforce }}
    steps:
      - name: Refuse checkout-ref for anyone but an allow-listed bot
        if: ${{ inputs.checkout-ref != '' && github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]' }}
        env:
          CHECKOUT_REF: ${{ inputs.checkout-ref }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "::error::checkout-ref was passed ('${CHECKOUT_REF}') but actor '${ACTOR}' is not dependabot[bot] or renovate[bot]. Refusing to check out that ref rather than trust a caller-side actor gate that this workflow cannot see or verify."
          exit 1

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          persist-credentials: false

      - name: Checkout the licence policy and reporter
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .easylife-workflows
          sparse-checkout: |
            licence-policy
            scripts
            tools
          persist-credentials: false

      - name: Check the package manager
        env:
          PACKAGE_MANAGER: ${{ inputs.node-package-manager }}
        run: |
          if [ "${PACKAGE_MANAGER}" != "yarn" ] && [ "${PACKAGE_MANAGER}" != "npm" ]; then
            echo "::error::node-package-manager must be 'yarn' or 'npm', not '${PACKAGE_MANAGER}'."
            exit 1
          fi

      # No node cache, same reason as the npm dependencies job above (#153).
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}

      - name: Read the licence exclusions from the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # No ref: the contents API then answers for the default branch. The raw media type returns
          # the file itself. 404 is the normal "no file" answer; any other failure is reported and
          # treated as no exclusions, which can only add findings.
          if gh api --method GET "repos/${REPOSITORY}/contents/.licenceignore" \
              -H "Accept: application/vnd.github.raw" > "${RUNNER_TEMP}/licenceignore" 2> "${RUNNER_TEMP}/licenceignore.err"; then
            echo "Excluding the packages listed in .licenceignore on the default branch."
          else
            if ! grep -q "404" "${RUNNER_TEMP}/licenceignore.err"; then
              echo "::warning::Could not read .licenceignore on the default branch; excluding nothing."
            else
              echo "No .licenceignore on the default branch; excluding nothing."
            fi
            : > "${RUNNER_TEMP}/licenceignore"
          fi

      - name: Install without running scripts
        if: inputs.node-package-manager == 'yarn'
        working-directory: ${{ inputs.node-working-directory }}
        env:
          GITHUB_PACKAGE_TOKEN: ${{ secrets.package-token-readonly || secrets.package-token }}
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Install without running scripts (npm)
        if: inputs.node-package-manager == 'npm'
        working-directory: ${{ inputs.node-working-directory }}
        env:
          GITHUB_PACKAGE_TOKEN: ${{ secrets.package-token-readonly || secrets.package-token }}
        run: npm ci --ignore-scripts --no-audit --no-fund

      # The lister's dependencies come from its own lockfile (npm ci), with no install scripts and no
      # token in the environment.
      #
      # A repository with a single package.json lists only its production dependencies: what ships is
      # what the licences bind, for yarn and npm alike. A workspace (yarn or npm) lists everything that is
      # installed instead, because
      # license-checker's --production reads only the ROOT package.json, and a workspace root usually
      # lists none of the packages its apps use (checked on EasyLife365-Identity: the root listing
      # missed recharts, file-saver, jszip, papaparse and the other packages only the apps depend on).
      # The price is that development tooling is checked too. Private workspace packages are the
      # repository's own code and are left out either way.
      # The lister needs Node 24 or later whatever node-version the caller builds with, so it runs
      # under its own setup. It is installed and run from a copy outside the scanned workspace, so
      # Node's module lookup can never fall through to the repository's own node_modules.
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: List the licences
        env:
          NODE_DIRECTORY: ${{ inputs.node-working-directory }}
        run: |
          cp -r ./.easylife-workflows/tools/licence-checker "${RUNNER_TEMP}/licence-checker"
          npm ci --ignore-scripts --no-audit --no-fund --prefix "${RUNNER_TEMP}/licence-checker" \
            || echo "::warning::Could not install the licence lister; the listing will be missing."
          # The lister reads the node_modules of the folder it runs in.
          cd "${NODE_DIRECTORY}"
          scope="--production"
          if node -e 'process.exit(require("./package.json").workspaces ? 0 : 1)'; then
            scope=""
          fi
          # shellcheck disable=SC2086
          node "${RUNNER_TEMP}/licence-checker/node_modules/license-checker-rseidelsohn/bin/license-checker-rseidelsohn.js" \
            ${scope} --excludePrivatePackages --json --out "${RUNNER_TEMP}/licences.json" || echo "license-checker exited with $?"

      - name: Report
        env:
          LICENCE_ENFORCE: ${{ inputs.licence-enforce }}
        run: |
          node .easylife-workflows/scripts/licence-report.mjs --ecosystem npm --title "npm licences" \
            --input "${RUNNER_TEMP}/licences.json" --policy .easylife-workflows/licence-policy/policy.json \
            --ignore "${RUNNER_TEMP}/licenceignore" --enforce "${LICENCE_ENFORCE}"
