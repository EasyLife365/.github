name: React build

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: '24.x'
      yarn:
        required: false
        type: boolean
        default: true
      checkout-ref:
        description: Ref to check out, e.g. github.event.pull_request.head.sha. Needed only by a
          caller using pull_request_target (which otherwise leaves github.sha resolving to the
          BASE branch, not the pull request being built) -- leave empty for the normal
          push/pull_request case.
        required: false
        type: string
        default: ''
    secrets:
      GITHUB_PACKAGE_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        env:
          GITHUB_PACKAGE_TOKEN: ${{ secrets.GITHUB_PACKAGE_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_PACKAGE_TOKEN }}
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.yarn && 'yarn' || 'npm' }}
          registry-url: 'https://npm.pkg.github.com'
          scope: '@easylife365'

      - name: Install Yarn v1
        if: ${{ inputs.yarn }}
        run: npm install -g yarn@1

      - name: Install dependencies
        if: ${{ inputs.yarn }}
        run: yarn install --frozen-lockfile
        env:
          GITHUB_PACKAGE_TOKEN: ${{ secrets.GITHUB_PACKAGE_TOKEN }}

      - name: Install dependencies
        if: ${{ !inputs.yarn }}
        run: npm ci
        env:
          GITHUB_PACKAGE_TOKEN: ${{ secrets.GITHUB_PACKAGE_TOKEN }}

      - name: Run build gates (yarn)
        if: ${{ inputs.yarn }}
        run: yarn build
        env:
          GITHUB_PACKAGE_TOKEN: ${{ secrets.GITHUB_PACKAGE_TOKEN }}

      - name: Run build gates (npm)
        if: ${{ !inputs.yarn }}
        run: npm run build --if-present
        env:
          GITHUB_PACKAGE_TOKEN: ${{ secrets.GITHUB_PACKAGE_TOKEN }}
