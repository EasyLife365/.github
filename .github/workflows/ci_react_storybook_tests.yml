name: React Storybook tests

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: '24.x'
      yarn:
        required: false
        type: boolean
        default: true
      storybook-shards:
        required: false
        type: string
        default: '["1/1"]'
    secrets:
      GITHUB_PACKAGE_TOKEN:
        required: false

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  storybook-tests:
    name: storybook-tests (${{ matrix.storybook-shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        storybook-shard: ${{ fromJSON(inputs.storybook-shards) }}
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      NODE_OPTIONS: --max-old-space-size=4096
      STORYBOOK_SHARD: ${{ matrix.storybook-shard }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        env:
          GITHUB_PACKAGE_TOKEN: ${{ secrets.GITHUB_PACKAGE_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_PACKAGE_TOKEN }}
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.yarn && 'yarn' || 'npm' }}
          registry-url: 'https://npm.pkg.github.com'
          scope: '@easylife365'

      - name: Install Yarn v1
        if: ${{ inputs.yarn }}
        run: npm install -g yarn@1

      - name: Install dependencies
        if: ${{ inputs.yarn }}
        run: yarn install --frozen-lockfile
        env:
          GITHUB_PACKAGE_TOKEN: ${{ secrets.GITHUB_PACKAGE_TOKEN }}

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/yarn.lock', '**/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright
        if: ${{ inputs.yarn }}
        run: yarn playwright install chromium --with-deps
        env:
          GITHUB_PACKAGE_TOKEN: ${{ secrets.GITHUB_PACKAGE_TOKEN }}

      - name: Build Storybook
        if: ${{ inputs.yarn }}
        run: yarn storybook:export
        env:
          GITHUB_PACKAGE_TOKEN: ${{ secrets.GITHUB_PACKAGE_TOKEN }}

      - name: Serve Storybook and run tests
        if: ${{ inputs.yarn }}
        run: yarn test:ci-storybook
        env:
          GITHUB_PACKAGE_TOKEN: ${{ secrets.GITHUB_PACKAGE_TOKEN }}

      - name: Install dependencies
        if: ${{ !inputs.yarn }}
        run: npm ci
        env:
          GITHUB_PACKAGE_TOKEN: ${{ secrets.GITHUB_PACKAGE_TOKEN }}

      - name: Cache Playwright browsers
        if: ${{ !inputs.yarn }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright
        if: ${{ !inputs.yarn }}
        run: npx playwright install chromium --with-deps

      - name: Build Storybook
        if: ${{ !inputs.yarn }}
        run: npm run storybook:export

      - name: Serve Storybook and run tests
        if: ${{ !inputs.yarn }}
        run: npm run test:ci-storybook

      - uses: dorny/test-reporter@v1
        if: always() && hashFiles('junit.xml') != ''
        with:
          name: Storybook Test Results ${{ matrix.storybook-shard }}
          path: junit.xml
          reporter: jest-junit

      - name: Publish Storybook Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always() && hashFiles('junit.xml') != ''
        with:
          check_name: Storybook Test Results ${{ matrix.storybook-shard }}
          files: |
            junit.xml
