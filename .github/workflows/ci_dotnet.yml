name: Dotnet Build & Test

on:
  workflow_call:

    inputs:
      dotnet-version:
        required: false
        type: string
        default: '9.x'

      use-azurite:
        required: false
        type: boolean
        default: false

      add-function-core-tools:
        required: false
        type: boolean
        default: false

      project-name:
        required: false
        type: string

      test-filter:
        required: false
        type: string
        default: ''
      
      allow-zero-tests:
        description: 'Treat zero discovered/matched tests as warning instead of failure'
        required: false
        type: boolean
        default: false

      use-mtp-logging:
        description: 'Use MTP-native --report-trx instead of --logger trx (required for xunit v3 / .NET 10+)'
        required: false
        type: boolean
        default: false

      use-test-logger:
        description: 'Attach test logger arguments (disable for MTP setups that fail when logger args are present)'
        required: false
        type: boolean
        default: true

      run-tests:
        description: 'Whether to run tests (set to false to only build)'
        required: false
        type: boolean
        default: true

      upload-artifacts:
        description: 'Whether to upload build artifacts'
        required: false
        type: boolean
        default: false

      artifacts-path:
        description: 'Path to publish artifacts (relative to repo root, e.g. ./published)'
        required: false
        type: string
        default: './published'

      artifact-name:
        description: 'Name of the artifact to upload (optional)'
        required: false
        type: string
        default: ''

      artifact-retention-days:
        description: 'Number of days to retain artifacts'
        required: false
        type: number
        default: 15

      azure-login:
        description: 'Sign in to Azure with OIDC before the test step, so fixtures can resolve @Microsoft.KeyVault(SecretUri=...) references out of their configuration. The CALLING workflow must also grant id-token: write. Identity comes from the CI_AADAPPID / TENANTID / SUBSCRIPTIONID variables unless overridden by the inputs below.'
        required: false
        type: boolean
        default: false

      azure-client-id:
        description: 'Override for the Entra application (client) id. Leave empty to use the CI_AADAPPID variable, which resolves against the CALLING repository and so can be set once at organization scope.'
        required: false
        type: string
        default: ''

      azure-tenant-id:
        description: 'Override for the Entra tenant id. Leave empty to use the TENANTID variable.'
        required: false
        type: string
        default: ''

      azure-subscription-id:
        description: 'Optional. Override for the Azure subscription id. Leave empty to use the SUBSCRIPTIONID variable, or leave both empty: Key Vault data-plane calls are not subscription-scoped, and the sign-in then runs with allow-no-subscriptions.'
        required: false
        type: string
        default: ''

    secrets:
      PACKAGE-TOKEN:
        required: true

permissions:
  checks: write
  contents: read
  pull-requests: write
  # Ceiling only. A caller that does not grant id-token: write cannot mint a token,
  # so this is inert for every repository that leaves azure-login off.
  id-token: write

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install dependencies
        run: |
          if [ -z "${{ inputs.project-name }}" ]; then
            echo "Restoring all projects..."
            dotnet restore
          else
            echo "Restoring project: ${{ inputs.project-name }}"
            dotnet restore "${{ inputs.project-name }}"
          fi
        env:
          GITHUB_PACKAGE_TOKEN: ${{ secrets.PACKAGE-TOKEN }}

      - name: Build
        run: |
          if [ -z "${{ inputs.project-name }}" ]; then
            echo "Building all projects..."
            dotnet build --configuration Release --no-restore
          else
            echo "Building project: ${{ inputs.project-name }}"
            dotnet build "${{ inputs.project-name }}" --configuration Release --no-restore
          fi

      - name: Publish
        if: ${{ inputs.upload-artifacts }}
        run: |
          if [ -z "${{ inputs.project-name }}" ]; then
            echo "::error::project-name is required when upload-artifacts is true."
            exit 1
          fi
          echo "Publishing project: ${{ inputs.project-name }}"
          dotnet publish "${{ inputs.project-name }}" --configuration Release --no-build --output "${{ inputs.artifacts-path }}"

      - name: Setup Node.js environment
        if: ${{ (inputs.use-azurite || inputs.add-function-core-tools) && inputs.run-tests }}
        uses: actions/setup-node@v4

      - name: Install Azure Functions Core Tools
        if: ${{ inputs.add-function-core-tools && inputs.run-tests }}
        run: npm install -g azure-functions-core-tools@4 --unsafe-perm true
        env:
          GITHUB_PACKAGE_TOKEN: ${{ secrets.PACKAGE-TOKEN }}

      - name: Install Azurite
        if: ${{ inputs.use-azurite && inputs.run-tests }}
        run: npm install -g azurite
        env:
          GITHUB_PACKAGE_TOKEN: ${{ secrets.PACKAGE-TOKEN }}

      - name: Run Azurite in Background
        if: ${{ inputs.use-azurite && inputs.run-tests }}
        shell: bash
        run: azurite --skipApiVersionCheck &

      - name: Check Azure sign-in inputs
        if: ${{ inputs.azure-login && inputs.run-tests }}
        shell: bash
        run: |
          missing=""
          if [ -z "${{ inputs.azure-client-id || vars.CI_AADAPPID }}" ]; then missing="$missing CI_AADAPPID"; fi
          if [ -z "${{ inputs.azure-tenant-id || vars.TENANTID }}" ]; then missing="$missing TENANTID"; fi
          if [ -n "$missing" ]; then
            echo "::error::azure-login is true but these are empty:$missing."
            echo "::error::Set them once as ORGANIZATION variables and scope them to this repository."
            echo "::error::A variable scoped to a GitHub environment does not resolve here: the test job"
            echo "::error::deliberately joins no environment, so that pull requests are not gated by"
            echo "::error::deployment protection rules. Organization or repository scope, not environment."
            exit 1
          fi
          if [ -z "${{ inputs.azure-subscription-id || vars.SUBSCRIPTIONID }}" ]; then
            echo "No subscription id configured; signing in with allow-no-subscriptions."
            echo "That is expected: Key Vault data-plane calls are not subscription-scoped, and"
            echo "the Key Vault roles carry only dataActions, so this principal may see none."
          fi

      - name: Azure login
        if: ${{ inputs.azure-login && inputs.run-tests }}
        uses: azure/login@v2
        with:
          # vars resolves against the CALLING repository, so one organization variable
          # serves every caller and no identity is repeated per repository.
          client-id: ${{ inputs.azure-client-id || vars.CI_AADAPPID }}
          tenant-id: ${{ inputs.azure-tenant-id || vars.TENANTID }}
          subscription-id: ${{ inputs.azure-subscription-id || vars.SUBSCRIPTIONID }}
          # Without this, az login fails when the principal can enumerate no subscription --
          # which is the normal case here, since the Key Vault roles grant dataActions only.
          allow-no-subscriptions: ${{ (inputs.azure-subscription-id || vars.SUBSCRIPTIONID) == '' }}

      - name: Test
        if: ${{ inputs.run-tests }}
        run: |
          TEST_FILTER="${{ inputs.test-filter }}"
          ALLOW_ZERO_TESTS="${{ inputs.allow-zero-tests }}"
          FILTER_ARGS=()
          FAILED=0
          
          is_zero_test_output() {
            local output="$1"
            echo "$output" | grep -Eiq "Zero tests ran|No test matches the given testcase filter|No test is available in|No tests were found"
          }

          if [ "${{ inputs.use-test-logger }}" = "true" ]; then
            if [ "${{ inputs.use-mtp-logging }}" = "true" ]; then
              LOGGER_ARGS=(--report-trx --results-directory ./TestResults)
            else
              LOGGER_ARGS=(--logger trx --results-directory ./TestResults)
            fi
          else
            LOGGER_ARGS=(--results-directory ./TestResults)
          fi

          if [ -n "$TEST_FILTER" ]; then
            echo "Using test filter: $TEST_FILTER"
            FILTER_ARGS=(--filter "$TEST_FILTER")
          else
            echo "No test filter provided. Running all tests."
          fi

          set +e
          if [ -z "${{ inputs.project-name }}" ]; then
            echo "Discovering test projects..."
            mapfile -t TEST_PROJECTS < <(find . -iname "*test*.csproj" | sort)

            if [ ${#TEST_PROJECTS[@]} -eq 0 ]; then
              echo "::error::No test projects found."
              exit 1
            fi

            echo "Found ${#TEST_PROJECTS[@]} test project(s):"
            printf '  %s\n' "${TEST_PROJECTS[@]}"
            echo ""

            for PROJECT in "${TEST_PROJECTS[@]}"; do
              echo "============================================"
              echo "Testing: $PROJECT"
              echo "============================================"
              output=$(dotnet test "$PROJECT" --no-restore --verbosity normal "${LOGGER_ARGS[@]}" "${FILTER_ARGS[@]}" 2>&1)
              exit_code=$?
              echo "$output"
              if [ $exit_code -ne 0 ]; then
                if [ "$ALLOW_ZERO_TESTS" = "true" ] && is_zero_test_output "$output"; then
                  echo "::warning::Zero tests ran for $PROJECT; continuing."
                else
                  echo "::warning::Tests failed in $PROJECT"
                  FAILED=1
                fi
              fi
              echo ""
            done

            if [ $FAILED -ne 0 ]; then
              echo "::error::One or more test projects failed."
              exit 1
            fi
          else
            echo "Testing project: ${{ inputs.project-name }}"
            output=$(dotnet test "${{ inputs.project-name }}" --no-restore --verbosity normal "${LOGGER_ARGS[@]}" "${FILTER_ARGS[@]}" 2>&1)
            exit_code=$?
            echo "$output"
            if [ $exit_code -ne 0 ]; then
              if [ "$ALLOW_ZERO_TESTS" = "true" ] && is_zero_test_output "$output"; then
                echo "::warning::Zero tests ran for ${{ inputs.project-name }}; continuing."
              else
                echo "::error::Tests failed in ${{ inputs.project-name }}"
                exit 1
              fi
            fi
          fi
          set -e

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: ${{ always() && inputs.run-tests && inputs.use-test-logger }}
        with:
          files: |
            TestResults/*.trx

      - name: Upload artifacts
        if: ${{ inputs.upload-artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name != '' && inputs.artifact-name || github.event.repository.name }}
          path: ${{ inputs.artifacts-path }}
          retention-days: ${{ inputs.artifact-retention-days }}
          include-hidden-files: true
