name: Dotnet Build & Test

on:
  workflow_call:

    inputs:
      dotnet-version:
        required: false
        type: string
        default: '9.x'

      use-azurite:
        required: false
        type: boolean
        default: false

      add-function-core-tools:
        required: false
        type: boolean
        default: false

      project-name:
        required: false
        type: string

      test-filter:
        required: false
        type: string
        default: ''
      
      allow-zero-tests:
        description: 'Treat zero discovered/matched tests as warning instead of failure'
        required: false
        type: boolean
        default: false

      use-mtp-logging:
        description: 'Use MTP-native --report-trx instead of --logger trx (required for xunit v3 / .NET 10+)'
        required: false
        type: boolean
        default: false

      use-test-logger:
        description: 'Attach test logger arguments (disable for MTP setups that fail when logger args are present)'
        required: false
        type: boolean
        default: true

      run-tests:
        description: 'Whether to run tests (set to false to only build)'
        required: false
        type: boolean
        default: true

      upload-artifacts:
        description: 'Whether to upload build artifacts'
        required: false
        type: boolean
        default: false

      artifacts-path:
        description: 'Path to publish artifacts (relative to repo root, e.g. ./published)'
        required: false
        type: string
        default: './published'

      artifact-name:
        description: 'Name of the artifact to upload (optional)'
        required: false
        type: string
        default: ''

      artifact-retention-days:
        description: 'Number of days to retain artifacts'
        required: false
        type: number
        default: 15

      azure-login:
        description: 'Sign in to Azure with OIDC before the test step, so fixtures can resolve @Microsoft.KeyVault(SecretUri=...) references out of their configuration. The CALLING workflow must also grant id-token: write. Identity comes from the CI_AADAPPID / TENANTID / SUBSCRIPTIONID variables unless overridden by the inputs below.'
        required: false
        type: boolean
        default: false

      azure-client-id:
        description: 'Override for the Entra application (client) id. Leave empty to use the CI_AADAPPID variable, which resolves against the CALLING repository and so can be set once at organization scope.'
        required: false
        type: string
        default: ''

      azure-tenant-id:
        description: 'Override for the Entra tenant id. Leave empty to use the TENANTID variable.'
        required: false
        type: string
        default: ''

      azure-subscription-id:
        description: 'Optional. Override for the Azure subscription id. Leave empty to use the SUBSCRIPTIONID variable, or leave both empty: Key Vault data-plane calls are not subscription-scoped, and the sign-in then runs with allow-no-subscriptions.'
        required: false
        type: string
        default: ''

      checkout-ref:
        description: 'Ref to check out, e.g. github.event.pull_request.head.sha. Needed only by a caller using pull_request_target (which otherwise leaves github.sha resolving to the BASE branch, not the pull request being tested) -- leave empty for the normal push/pull_request case.'
        required: false
        type: string
        default: ''

    secrets:
      PACKAGE-TOKEN:
        required: true

# EVERY CALLER MUST GRANT ALL FOUR OF THESE, or none at all.
#
# A reusable workflow's permissions block is a REQUEST, not a ceiling. The caller's own block caps
# it, and anything the caller does not list becomes "none" -- at which point GitHub refuses the run
# at startup, before a single job begins:
#
#   The workflow is requesting 'id-token: write', but is only allowed 'id-token: none'.
#
# A caller with no permissions block at all is fine: it inherits the repository default and this
# block is satisfied. The trap is a caller with a PARTIAL block, which is strictly worse than none.
# Adding id-token here broke EasyLife365-Core, whose block listed the other three; adding a block
# with only contents and id-token broke Collaboration's and Exchange's integration workflows, whose
# TRX publish step needs checks and pull-requests.
#
# checks and pull-requests: the publish-unit-test-result-action step.
# id-token: the Azure sign-in below, when azure-login is true. Granting it is inert at run time
# while azure-login is off -- no step mints a token -- but it is NOT optional at startup.
permissions:
  checks: write
  contents: read
  pull-requests: write
  id-token: write

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Refuse checkout-ref for anyone but an allow-listed bot
        if: ${{ inputs.checkout-ref != '' && github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]' }}
        run: |
          echo "::error::checkout-ref was passed ('${{ inputs.checkout-ref }}') but actor '${{ github.actor }}' is not dependabot[bot] or renovate[bot]. Refusing to check out that ref rather than trust a caller-side actor gate that this workflow cannot see or verify."
          exit 1

      # id-token: write (see permissions above) puts an OIDC-minting credential
      # (ACTIONS_ID_TOKEN_REQUEST_TOKEN/_URL) in every step's environment for the whole job, not
      # just the Azure login step below -- azure-login's own `if` gates whether azure/login@v2
      # runs, but it gates nothing about which code in this job can read those two env vars and
      # mint an OIDC token itself. Once checkout-ref makes this job build/test real, unreviewed
      # dependency content, that combination hands a compromised dependency a path to whatever
      # Azure AD federated-credential trust this repository has, with azure-login: false doing
      # nothing to stop it. Refuse the combination outright rather than rely on every caller
      # remembering never to set both.
      - name: Refuse checkout-ref combined with azure-login
        if: ${{ inputs.checkout-ref != '' && inputs.azure-login }}
        run: |
          echo "::error::checkout-ref and azure-login cannot both be set. id-token: write exposes OIDC-minting credentials to the whole job, not only the Azure login step, so running this job against pull_request_target content (checkout-ref) while azure-login is true would hand any code in the job -- including a compromised dependency's own build-time script -- a path to mint tokens against this repository's Azure AD federated-credential trust."
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          fetch-depth: 0
          fetch-tags: true
          # false because this job's GITHUB_TOKEN carries checks:write and pull-requests:write
          # (see the permissions block above) and this workflow now sometimes runs against
          # pull_request_target content (checkout-ref set by the caller) -- a persisted
          # credential would sit on disk for the rest of the job, readable by any code that
          # runs afterward, including a package's own build-time targets.
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install dependencies
        run: |
          if [ -z "${{ inputs.project-name }}" ]; then
            echo "Restoring all projects..."
            dotnet restore
          else
            echo "Restoring project: ${{ inputs.project-name }}"
            dotnet restore "${{ inputs.project-name }}"
          fi
        env:
          GITHUB_PACKAGE_TOKEN: ${{ secrets.PACKAGE-TOKEN }}

      - name: Build
        run: |
          if [ -z "${{ inputs.project-name }}" ]; then
            echo "Building all projects..."
            dotnet build --configuration Release --no-restore
          else
            echo "Building project: ${{ inputs.project-name }}"
            dotnet build "${{ inputs.project-name }}" --configuration Release --no-restore
          fi

      - name: Publish
        if: ${{ inputs.upload-artifacts }}
        run: |
          if [ -z "${{ inputs.project-name }}" ]; then
            echo "::error::project-name is required when upload-artifacts is true."
            exit 1
          fi
          echo "Publishing project: ${{ inputs.project-name }}"
          dotnet publish "${{ inputs.project-name }}" --configuration Release --no-build --output "${{ inputs.artifacts-path }}"

      - name: Setup Node.js environment
        if: ${{ (inputs.use-azurite || inputs.add-function-core-tools) && inputs.run-tests }}
        uses: actions/setup-node@v4

      - name: Install Azure Functions Core Tools
        if: ${{ inputs.add-function-core-tools && inputs.run-tests }}
        run: npm install -g azure-functions-core-tools@4 --unsafe-perm true
        env:
          GITHUB_PACKAGE_TOKEN: ${{ secrets.PACKAGE-TOKEN }}

      - name: Install Azurite
        if: ${{ inputs.use-azurite && inputs.run-tests }}
        run: npm install -g azurite
        env:
          GITHUB_PACKAGE_TOKEN: ${{ secrets.PACKAGE-TOKEN }}

      - name: Run Azurite in Background
        if: ${{ inputs.use-azurite && inputs.run-tests }}
        shell: bash
        run: azurite --skipApiVersionCheck &

      - name: Check Azure sign-in inputs
        if: ${{ inputs.azure-login && inputs.run-tests }}
        shell: bash
        run: |
          missing=""
          if [ -z "${{ inputs.azure-client-id || vars.CI_AADAPPID }}" ]; then missing="$missing CI_AADAPPID"; fi
          if [ -z "${{ inputs.azure-tenant-id || vars.TENANTID }}" ]; then missing="$missing TENANTID"; fi
          if [ -n "$missing" ]; then
            echo "::error::azure-login is true but these are empty:$missing."
            echo "::error::Set them once as ORGANIZATION variables and scope them to this repository."
            echo "::error::A variable scoped to a GitHub environment does not resolve here: the test job"
            echo "::error::deliberately joins no environment, so that pull requests are not gated by"
            echo "::error::deployment protection rules. Organization or repository scope, not environment."
            exit 1
          fi
          if [ -z "${{ inputs.azure-subscription-id || vars.SUBSCRIPTIONID }}" ]; then
            echo "No subscription id configured; signing in with allow-no-subscriptions."
            echo "That is expected: Key Vault data-plane calls are not subscription-scoped, and"
            echo "the Key Vault roles carry only dataActions, so this principal may see none."
          fi

      - name: Azure login
        if: ${{ inputs.azure-login && inputs.run-tests }}
        uses: azure/login@v2
        with:
          # vars resolves against the CALLING repository, so one organization variable
          # serves every caller and no identity is repeated per repository.
          client-id: ${{ inputs.azure-client-id || vars.CI_AADAPPID }}
          tenant-id: ${{ inputs.azure-tenant-id || vars.TENANTID }}
          subscription-id: ${{ inputs.azure-subscription-id || vars.SUBSCRIPTIONID }}
          # Without this, az login fails when the principal can enumerate no subscription --
          # which is the normal case here, since the Key Vault roles grant dataActions only.
          allow-no-subscriptions: ${{ (inputs.azure-subscription-id || vars.SUBSCRIPTIONID) == '' }}

      - name: Test
        if: ${{ inputs.run-tests }}
        run: |
          TEST_FILTER="${{ inputs.test-filter }}"
          ALLOW_ZERO_TESTS="${{ inputs.allow-zero-tests }}"
          FILTER_ARGS=()
          FAILED=0
          
          is_zero_test_output() {
            local output="$1"
            echo "$output" | grep -Eiq "Zero tests ran|No test matches the given testcase filter|No test is available in|No tests were found"
          }

          if [ "${{ inputs.use-test-logger }}" = "true" ]; then
            if [ "${{ inputs.use-mtp-logging }}" = "true" ]; then
              LOGGER_ARGS=(--report-trx --results-directory ./TestResults)
            else
              LOGGER_ARGS=(--logger trx --results-directory ./TestResults)
            fi
          else
            LOGGER_ARGS=(--results-directory ./TestResults)
          fi

          if [ -n "$TEST_FILTER" ]; then
            echo "Using test filter: $TEST_FILTER"
            FILTER_ARGS=(--filter "$TEST_FILTER")
          else
            echo "No test filter provided. Running all tests."
          fi

          set +e
          if [ -z "${{ inputs.project-name }}" ]; then
            echo "Discovering test projects..."
            mapfile -t TEST_PROJECTS < <(find . -iname "*test*.csproj" | sort)

            if [ ${#TEST_PROJECTS[@]} -eq 0 ]; then
              echo "::error::No test projects found."
              exit 1
            fi

            echo "Found ${#TEST_PROJECTS[@]} test project(s):"
            printf '  %s\n' "${TEST_PROJECTS[@]}"
            echo ""

            for PROJECT in "${TEST_PROJECTS[@]}"; do
              echo "::group::Testing $PROJECT"
              # tee, rather than output=$(...) echoed afterwards. Capturing the whole run means no
              # live output, and it arrives as one undifferentiated block that
              # `gh run view --log-failed` then returns in full, setup noise included. PIPESTATUS
              # keeps dotnet's exit code rather than tee's.
              LOG=$(mktemp)
              dotnet test "$PROJECT" --no-restore --verbosity normal "${LOGGER_ARGS[@]}" "${FILTER_ARGS[@]}" 2>&1 | tee "$LOG"
              exit_code=${PIPESTATUS[0]}
              output=$(cat "$LOG")
              rm -f "$LOG"
              echo "::endgroup::"
              if [ $exit_code -ne 0 ]; then
                if [ "$ALLOW_ZERO_TESTS" = "true" ] && is_zero_test_output "$output"; then
                  echo "::warning::Zero tests ran for $PROJECT; continuing."
                else
                  echo "::warning::Tests failed in $PROJECT"
                  FAILED=1
                fi
              fi
              echo ""
            done

            if [ $FAILED -ne 0 ]; then
              echo "::error::One or more test projects failed."
              exit 1
            fi
          else
            echo "::group::Testing ${{ inputs.project-name }}"
            LOG=$(mktemp)
            dotnet test "${{ inputs.project-name }}" --no-restore --verbosity normal "${LOGGER_ARGS[@]}" "${FILTER_ARGS[@]}" 2>&1 | tee "$LOG"
            exit_code=${PIPESTATUS[0]}
            output=$(cat "$LOG")
            rm -f "$LOG"
            echo "::endgroup::"
            if [ $exit_code -ne 0 ]; then
              if [ "$ALLOW_ZERO_TESTS" = "true" ] && is_zero_test_output "$output"; then
                echo "::warning::Zero tests ran for ${{ inputs.project-name }}; continuing."
              else
                echo "::error::Tests failed in ${{ inputs.project-name }}"
                exit 1
              fi
            fi
          fi
          set -e

      # Runs even when the tests failed -- especially then. Without this the run page says nothing
      # at all about which test failed, and the only route to the answer is opening the log and
      # scrolling past restore, build and setup.
      - name: Checkout shared test summary script
        if: ${{ always() && inputs.run-tests }}
        uses: actions/checkout@v4
        with:
          repository: EasyLife365/.github
          ref: main
          path: .shared-github
          token: ${{ secrets.GITHUB_PACKAGE_TOKEN || github.token }}
          persist-credentials: false
          sparse-checkout: |
            scripts/test-summary.mjs

      - name: Summarise test results
        if: ${{ always() && inputs.run-tests }}
        shell: bash
        run: |
          node .shared-github/scripts/test-summary.mjs ./TestResults \
            --title "${{ inputs.project-name != '' && inputs.project-name || github.event.repository.name }}"

      # Keep the TRX. It is what makes two runs comparable -- which tests were executed then and
      # are not now -- and after the run the logs alone cannot answer that.
      - name: Upload test results
        if: ${{ always() && inputs.run-tests }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.job }}-${{ github.run_attempt }}
          path: TestResults/*.trx
          retention-days: 14
          if-no-files-found: ignore

      # Deliberately not gated on use-test-logger. That input turns off *logger arguments* for MTP
      # runners that reject them; those runners still write TRX, and gating the publish on it left
      # repositories that set it false -- Mail's live suite among them -- with no check run at all.
      # if-no-files-found on the action's own `files` glob handles the case where none were written.
      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: ${{ always() && inputs.run-tests }}
        continue-on-error: true
        with:
          files: |
            TestResults/*.trx
          action_fail: false

      - name: Upload artifacts
        if: ${{ inputs.upload-artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name != '' && inputs.artifact-name || github.event.repository.name }}
          path: ${{ inputs.artifacts-path }}
          retention-days: ${{ inputs.artifact-retention-days }}
          include-hidden-files: true
