name: Dotnet tests

on:
  workflow_call:

    inputs:
      dotnet-version:
        required: false
        type: string
        default: '9.x'

      use-azurite:
        required: false
        type: boolean
        default: false

      add-function-core-tools:
        required: false
        type: boolean
        default: false

      project-name:
        required: false
        type: string

      test-filter:
        required: false
        type: string
        default: ''

    secrets:
      PACKAGE-TOKEN:
        required: true

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install dependencies
        run: |
          if [ -z "${{ inputs.project-name }}" ]; then
            echo "Restoring all projects..."
            dotnet restore
          else
            echo "Restoring project: ${{ inputs.project-name }}"
            dotnet restore "${{ inputs.project-name }}"
          fi
        env:
          GITHUB_PACKAGE_TOKEN: ${{ secrets.PACKAGE-TOKEN }}

      - name: Build
        run: |
          if [ -z "${{ inputs.project-name }}" ]; then
            echo "Building all projects..."
            dotnet build --configuration Release --no-restore
          else
            echo "Building project: ${{ inputs.project-name }}"
            dotnet build "${{ inputs.project-name }}" --configuration Release --no-restore
          fi

      - name: Setup Node.js environment
        if: ${{ inputs.use-azurite || inputs.add-function-core-tools }}
        uses: actions/setup-node@v4

      - name: Install Azure Functions Core Tools
        if: ${{ inputs.add-function-core-tools }}
        run: npm install -g azure-functions-core-tools@4 --unsafe-perm true

      - name: Install Azurite
        if: ${{ inputs.use-azurite }}
        run: npm install -g azurite

      - name: Run Azurite in Background
        if: ${{ inputs.use-azurite }}
        shell: bash
        run: azurite --skipApiVersionCheck &

      - name: Test
        run: |
          TEST_FILTER="${{ inputs.test-filter }}"
          FILTER_ARGS=()
          FAILED=0

          if [ -n "$TEST_FILTER" ]; then
            echo "Using test filter: $TEST_FILTER"
            FILTER_ARGS=(--filter "$TEST_FILTER")
          else
            echo "No test filter provided. Running all tests."
          fi

          if [ -z "${{ inputs.project-name }}" ]; then
            echo "Discovering test projects..."
            mapfile -t TEST_PROJECTS < <(find . -iname "*test*.csproj" | sort)

            if [ ${#TEST_PROJECTS[@]} -eq 0 ]; then
              echo "::error::No test projects found."
              exit 1
            fi

            echo "Found ${#TEST_PROJECTS[@]} test project(s):"
            printf '  %s\n' "${TEST_PROJECTS[@]}"
            echo ""

            for PROJECT in "${TEST_PROJECTS[@]}"; do
              echo "============================================"
              echo "Testing: $PROJECT"
              echo "============================================"
              if ! dotnet test "$PROJECT" --no-restore --verbosity normal --logger trx --results-directory ./TestResults "${FILTER_ARGS[@]}"; then
                echo "::warning::Tests failed in $PROJECT"
                FAILED=1
              fi
              echo ""
            done

            if [ $FAILED -ne 0 ]; then
              echo "::error::One or more test projects failed."
              exit 1
            fi
          else
            echo "Testing project: ${{ inputs.project-name }}"
            dotnet test "${{ inputs.project-name }}" --no-restore --verbosity normal --logger trx --results-directory ./TestResults "${FILTER_ARGS[@]}"
          fi

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: |
            TestResults/*.trx
