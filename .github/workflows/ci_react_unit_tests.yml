name: React unit tests

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: '24.x'
      yarn:
        required: false
        type: boolean
        default: true
      checkout-ref:
        description: The head commit of the pull request to check out, github.event.pull_request.head.sha (any other value is refused). Needed only by a
          caller using pull_request_target (which otherwise leaves github.sha resolving to the
          BASE branch, not the pull request being tested) -- leave empty for the normal
          push/pull_request case.
        required: false
        type: string
        default: ''
    secrets:
      GITHUB_PACKAGE_TOKEN:
        required: false
      GITHUB_PACKAGE_TOKEN_READONLY:
        description: 'A read:packages-only token, used instead of GITHUB_PACKAGE_TOKEN whenever checkout-ref is set -- that path installs real, unreviewed Dependabot/Renovate content, and npm/yarn install can run arbitrary postinstall scripts from it, which should never be able to reach a credential that can also publish. Optional: falls back to GITHUB_PACKAGE_TOKEN if not provided, so an existing caller with no readonly token configured keeps working exactly as before, just without this extra separation until it adds one.'
        required: false

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      # checkout-ref makes this job check out a pull request's own code in a pull_request_target
      # run, which holds secrets, so it is accepted only for a bot's own pull request. github.actor
      # alone does not prove that: it is whoever caused the event, which an outsider can arrange to be
      # dependabot[bot] (Dependabot updating a branch of their fork), and a re-run keeps it. The author
      # of the pull request, the repository its branch lives in and its head commit cannot be set by
      # anyone else. Every value reaches the shell through env:, never as an expression inside run:,
      # so no value can become shell code (EasyLife365/.github#191).
      - name: Refuse checkout-ref for anyone but an allow-listed bot
        if: ${{ inputs.checkout-ref != '' }}
        shell: bash
        env:
          CHECKOUT_REF: ${{ inputs.checkout-ref }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          is_bot() { [ "$1" = 'dependabot[bot]' ] || [ "$1" = 'renovate[bot]' ]; }
          # Only GitHub-made values (event name, logins, repository names) are printed, never
          # checkout-ref itself, so the message cannot carry a workflow command.
          reason=''
          if [ "$EVENT_NAME" != 'pull_request_target' ]; then
            reason="the event is $EVENT_NAME, not pull_request_target"
          elif ! is_bot "$PR_AUTHOR"; then
            reason="the pull request was opened by '$PR_AUTHOR', not by dependabot[bot] or renovate[bot]"
          elif ! is_bot "$ACTOR"; then
            reason="the event was caused by '$ACTOR', not by dependabot[bot] or renovate[bot]"
          elif [ "$PR_HEAD_REPO" != "$REPOSITORY" ]; then
            reason="the pull request branch lives in '$PR_HEAD_REPO', not in '$REPOSITORY'"
          elif [ "$CHECKOUT_REF" != "$PR_HEAD_SHA" ]; then
            reason='checkout-ref is not the head commit of the pull request'
          fi
          if [ -n "$reason" ]; then
            echo "::error::Refusing to check out checkout-ref: $reason."
            exit 1
          fi
          echo "checkout-ref accepted: the head commit of a pull request opened by $PR_AUTHOR in $REPOSITORY."

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          # This job's GITHUB_TOKEN carries checks:write and pull-requests:write (see permissions
          # above), and this workflow now sometimes runs against pull_request_target content for
          # Dependabot/Renovate PRs -- a persisted credential would sit on disk for the rest of
          # the job, readable by any code that runs afterward.
          persist-credentials: false

      # No package-manager cache: a PR or merge-queue ref cannot reuse another one's cache and push CI no longer
      # seeds main, so every ref saved its own 1+ GB copy for no gain over a cold install (#155).
      - uses: actions/setup-node@v7
        env:
          GITHUB_PACKAGE_TOKEN: ${{ (inputs.checkout-ref != '' && secrets.GITHUB_PACKAGE_TOKEN_READONLY) || secrets.GITHUB_PACKAGE_TOKEN }}
          NODE_AUTH_TOKEN: ${{ (inputs.checkout-ref != '' && secrets.GITHUB_PACKAGE_TOKEN_READONLY) || secrets.GITHUB_PACKAGE_TOKEN }}
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: 'https://npm.pkg.github.com'
          scope: '@easylife365'

      - name: Install Yarn v1
        if: ${{ inputs.yarn }}
        run: npm install -g yarn@1

      - name: Install dependencies
        if: ${{ inputs.yarn }}
        run: yarn install --frozen-lockfile
        env:
          GITHUB_PACKAGE_TOKEN: ${{ (inputs.checkout-ref != '' && secrets.GITHUB_PACKAGE_TOKEN_READONLY) || secrets.GITHUB_PACKAGE_TOKEN }}

      - name: Run vitest
        if: ${{ inputs.yarn }}
        run: yarn test
        env:
          GITHUB_PACKAGE_TOKEN: ${{ (inputs.checkout-ref != '' && secrets.GITHUB_PACKAGE_TOKEN_READONLY) || secrets.GITHUB_PACKAGE_TOKEN }}

      - name: Install dependencies
        if: ${{ !inputs.yarn }}
        run: npm ci
        env:
          GITHUB_PACKAGE_TOKEN: ${{ (inputs.checkout-ref != '' && secrets.GITHUB_PACKAGE_TOKEN_READONLY) || secrets.GITHUB_PACKAGE_TOKEN }}

      - name: Run vitest
        if: ${{ !inputs.yarn }}
        run: npm test

      - uses: dorny/test-reporter@v3
        if: always() && hashFiles('junit.xml') != ''
        with:
          name: Unit Test Results
          path: junit.xml
          reporter: jest-junit

      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always() && hashFiles('junit.xml') != ''
        with:
          files: |
            junit.xml
