name: Nuget Release

on:
  workflow_call:
    inputs:
      dotnet-version:
        required: false
        type: string
        default: '10.x'
      
      use-azurite:
        required: false
        type: boolean
        default: false

    secrets:
      PACKAGE-TOKEN:
        required: true

permissions:
  contents: read
  packages: write
  checks: write
  pull-requests: write

jobs:
  release-with-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: EasyLife365/get-version-action@v1.2.0
        id: version

      # The dotnet download CDN fails transiently (HTTP 409); retry once before failing the job.
      - name: Setup .NET
        id: setup-dotnet
        continue-on-error: true
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Setup .NET (retry)
        if: steps.setup-dotnet.outcome == 'failure'
        run: sleep 30

      - name: Setup .NET (retry)
        if: steps.setup-dotnet.outcome == 'failure'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore
        env:
            GITHUB_PACKAGE_TOKEN: ${{ secrets.PACKAGE-TOKEN }}

      - name: Setup Node.js environment
        if: ${{ inputs.use-azurite }}
        uses: actions/setup-node@v7
    
      - name: Install Azurite
        if: ${{ inputs.use-azurite }}
        run: npm install -g azurite
    
      - name: Run Azurite in Background
        if: ${{ inputs.use-azurite }}
        shell: bash
        run: azurite --skipApiVersionCheck &

      - name: Build
        run: dotnet build -c Release --no-restore -p:Version=${{ steps.version.outputs.versionWithoutV }}

      - name: Pack
        run: >
          dotnet pack -c Release --no-restore
          --output nupkgs
          -p:PackageVersion=${{ steps.version.outputs.versionWithoutV }}
          -p:IncludeSymbols=true
          -p:SymbolPackageFormat=snupkg

      - name: Publish packages
        run: >
          dotnet nuget push "nupkgs/*.nupkg"
          --api-key ${{ secrets.PACKAGE-TOKEN }}
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          --skip-duplicate
