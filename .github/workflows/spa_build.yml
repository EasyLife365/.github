name: SPA Build

on:
  workflow_call:
   inputs:
     app-location:
       description: The project location of the app
       required: true
       type: string
     app-target:
       description: The project target of the app
       required: true
       type: string
     app-artifact:
       description: The project artifact of the app
       required: true
       type: string
     yarn:
       description: Use Yarn v1 for dependency installation
       required: false
       type: boolean
       default: false
     telemetry-client-id:
       description: Optional telemetry client id override injected at build time
       required: false
       type: string
       default: ''
     telemetry-connection-string:
       description: Application Insights connection string injected at build time. Preferred over the
         instrumentation key, which is the retired ingestion path; leave empty to keep the key only.
       required: false
       type: string
       default: ''
     telemetry-connection-string-env-name:
       description: The environment variable name to use for the telemetry connection string
       required: false
       type: string
       default: 'VITE_EASY_APPINSIGHTS_CONNECTIONSTRING'
     telemetry-env-name:
       description: The environment variable name to use for telemetry client id
       required: false
       type: string
       default: 'VITE_TELEMETRY_CLIENTID'
     upload-artifact:
       description: Whether to upload the build artifact
       required: false
       type: boolean
       default: true
     checkout-ref:
       description: Ref to check out, e.g. github.event.pull_request.head.sha. Needed only by a
         caller using pull_request_target (which otherwise leaves github.sha resolving to the BASE
         branch, not the pull request being tested) -- leave empty for the normal push/pull_request
         case.
       required: false
       type: string
       default: ''
   secrets:
     package-token:
       description: GitHub Packages token used to restore private @easylife365 npm packages
       required: true
     package-token-readonly:
       description: 'A read:packages-only token, used instead of package-token whenever checkout-ref is set -- that path installs real, unreviewed Dependabot/Renovate content, and npm/yarn install can run arbitrary postinstall scripts from it, which should never be able to reach a credential that can also publish. Optional: falls back to package-token if not provided, so an existing caller with no readonly token configured keeps working exactly as before, just without this extra separation until it adds one.'
       required: false

env:
  CI: false

permissions:
   contents: read
   # id-token: write removed -- nothing in this job uses OIDC (no azure/login or equivalent step
   # anywhere in this file). It was dead scope, and now that this job can run against checkout-ref
   # (untrusted Dependabot/Renovate content), granting it unconditionally would have exposed an
   # OIDC-minting credential to a compromised dependency's build-time script for no functional
   # reason. If a future caller genuinely needs OIDC here, it needs the same restructuring
   # ci_dotnet.yml needs -- a job carrying checkout-ref must never also carry id-token: write --
   # not simply adding this back.

jobs:
  build:
   runs-on: 'ubuntu-latest'
   timeout-minutes: 15

   steps:
     - name: Refuse checkout-ref for anyone but an allow-listed bot
       if: ${{ inputs.checkout-ref != '' && github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]' }}
       run: |
         echo "::error::checkout-ref was passed ('${{ inputs.checkout-ref }}') but actor '${{ github.actor }}' is not dependabot[bot] or renovate[bot]. Refusing to check out that ref rather than trust a caller-side actor gate that this workflow cannot see or verify."
         exit 1

     - name: Checkout
       uses: actions/checkout@v7
       with:
         ref: ${{ inputs.checkout-ref || github.sha }}
         fetch-depth: 0
         fetch-tags: true
         # A caller using pull_request_target passes checkout-ref for Dependabot/Renovate PRs, so
         # this job runs against a dependency bump it hasn't reviewed -- nothing in this job pushes
         # or comments, so there's no reason to leave a credential on disk for the rest of it.
         persist-credentials: false

     - uses: actions/setup-node@v7
       env:
         GITHUB_PACKAGE_TOKEN: ${{ (inputs.checkout-ref != '' && secrets.package-token-readonly) || secrets.package-token }}
         # actions/setup-node@v7 always writes "_authToken=${NODE_AUTH_TOKEN}" into the generated
         # .npmrc, unlike v4 which only wrote it when the variable was set. It only re-exports
         # NODE_AUTH_TOKEN to later steps if the variable was already present when this step ran, so
         # it has to be set here -- not on the install/build steps below -- to avoid every later
         # yarn/npm invocation failing with "Failed to replace env in config: ${NODE_AUTH_TOKEN}".
         # Matches the same fix already applied in ci_react_build.yml/ci_react_unit_tests.yml.
         NODE_AUTH_TOKEN: ${{ (inputs.checkout-ref != '' && secrets.package-token-readonly) || secrets.package-token }}
       with:
         node-version: '24.x'
         registry-url: 'https://npm.pkg.github.com'
         scope: '@easylife365'

     - name: Install Yarn v1
       if: ${{ inputs.yarn }}
       run: npm install -g yarn@1

     - name: Install dependencies
       if: ${{ inputs.yarn }}
       run: yarn install --frozen-lockfile
       env:
         GITHUB_PACKAGE_TOKEN: ${{ (inputs.checkout-ref != '' && secrets.package-token-readonly) || secrets.package-token }}

     - uses: bahmutov/npm-install@v1
       if: ${{ !inputs.yarn }}
       with:
         working-directory: ${{ inputs.app-location }}
       env:
         GITHUB_PACKAGE_TOKEN: ${{ (inputs.checkout-ref != '' && secrets.package-token-readonly) || secrets.package-token }}

     - uses: EasyLife365/get-version-action@v1.1.3
       id: version

     - name: Set version (npm)
       if: ${{ !inputs.yarn }}
       run: npm version ${{ steps.version.outputs.versionWithoutV }} --no-git-tag-version
       working-directory: ${{ inputs.app-location }}

     - name: Set version (yarn)
       if: ${{ inputs.yarn }}
       run: yarn version --new-version ${{ steps.version.outputs.versionWithoutV }} --no-git-tag-version
       working-directory: ${{ inputs.app-location }}
       env:
         GITHUB_PACKAGE_TOKEN: ${{ (inputs.checkout-ref != '' && secrets.package-token-readonly) || secrets.package-token }}

     - name: Override telemetry env variable
       if: inputs.telemetry-client-id != ''
       run: echo "${{ inputs.telemetry-env-name }}=${{ inputs.telemetry-client-id }}" >> "$GITHUB_ENV"

     - name: Override telemetry connection string env variable
       if: inputs.telemetry-connection-string != ''
       run: echo "${{ inputs.telemetry-connection-string-env-name }}=${{ inputs.telemetry-connection-string }}" >> "$GITHUB_ENV"

     - name: Build (npm)
       if: ${{ !inputs.yarn }}
       run: "npm run build:${{ inputs.app-target }}"
       working-directory: ${{ inputs.app-location }}
       env:
         GITHUB_PACKAGE_TOKEN: ${{ (inputs.checkout-ref != '' && secrets.package-token-readonly) || secrets.package-token }}

     - name: Build (yarn)
       if: ${{ inputs.yarn }}
       run: "yarn build:${{ inputs.app-target }}"
       working-directory: ${{ inputs.app-location }}
       env:
         GITHUB_PACKAGE_TOKEN: ${{ (inputs.checkout-ref != '' && secrets.package-token-readonly) || secrets.package-token }}

     - name: Upload build app artifact
       if: ${{ inputs.upload-artifact }}
       uses: actions/upload-artifact@v7
       with:
         name: ${{ inputs.app-artifact }}
         path: "${{ inputs.app-location }}/dist"
         include-hidden-files: true
         retention-days: 15
