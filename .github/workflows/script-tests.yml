name: Script tests

# Runs the node:test suites for the scripts this repository ships (scripts/lib/*.test.mjs).
# Its own workflow file so it can become a required check later; the job name is the context.

on:
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/script-tests.yml'

permissions:
  contents: read

jobs:
  script-tests:
    name: script-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run script unit tests
        run: node --test scripts/lib/dependency-only.test.mjs
