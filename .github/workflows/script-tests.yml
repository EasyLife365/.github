name: Script tests

# Runs the node:test suites for the scripts this repository ships (scripts/lib/*.test.mjs).
# Its own workflow file so it can become a required check later; the job name is the context.

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'licence-policy/**'
      - 'tools/**'
      - '.github/workflows/script-tests.yml'

permissions:
  contents: read

jobs:
  script-tests:
    name: script-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The licence lister's lockfile runs in every caller of the Security gate, so a change to it is
      # installed here first: exactly as the gate installs it, signatures checked, and run once.
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Install and run the licence lister
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix tools/licence-checker
          (cd tools/licence-checker && npm audit signatures)
          cd tools/licence-checker
          node node_modules/license-checker-rseidelsohn/bin/license-checker-rseidelsohn.js --production --json --out "${RUNNER_TEMP}/lister.json"
          node -e 'const n = Object.keys(require(process.argv[1])).length; if (n < 100) { console.error("only " + n + " packages listed"); process.exit(1); } console.log(n + " packages listed")' "${RUNNER_TEMP}/lister.json"

      - name: Run script unit tests
        run: node --test scripts/lib/dependency-only.test.mjs scripts/lib/licence-policy.test.mjs scripts/lib/licence-report.test.mjs
