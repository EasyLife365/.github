name: Sync PR title with linked issues

on:
  workflow_call:

jobs:
  update-title:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: 3361317
          private-key: ${{ secrets.SECOPS_TOKEN }}
          
      - name: Fetch linked issues via GraphQL
        id: graphql
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -x

          echo "Repo owner: ${{ github.repository_owner }}"
          echo "Repo name: ${{ github.event.repository.name }}"
          echo "PR number: ${{ github.event.pull_request.number }}"

          QUERY='
          query($owner: String!, $repo: String!, $pr: Int!) {
            repository(owner: $owner, name: $repo) {
              pullRequest(number: $pr) {
                closingIssuesReferences(first: 20) {
                  nodes {
                    number
                    labels(first: 20) {
                      nodes {
                        name
                      }
                    }
                  }
                }
              }
            }
          }'

          echo "Running GraphQL query..."

          RESPONSE=$(gh api graphql \
            -f query="$QUERY" \
            -f owner="${{ github.repository_owner }}" \
            -f repo="${{ github.event.repository.name }}" \
            -F pr=${{ github.event.pull_request.number }})

          echo "Raw response:"
          echo "$RESPONSE"

          echo "$RESPONSE" > response.json

          echo "Parsed response (pretty):"
          cat response.json | jq .

          COUNT=$(jq '.data.repository.pullRequest.closingIssuesReferences.nodes | length' response.json)

          echo "Issue count: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "No linked issues found"
            echo "suffix=" >> $GITHUB_OUTPUT
            exit 0
          fi

          SUFFIX=""

          for i in $(seq 0 $((COUNT-1))); do
            echo "Processing issue index: $i"

            NUMBER=$(jq -r ".data.repository.pullRequest.closingIssuesReferences.nodes[$i].number" response.json)
            echo "Issue number: $NUMBER"

            LABELS=$(jq -r ".data.repository.pullRequest.closingIssuesReferences.nodes[$i].labels.nodes[].name" response.json)
            echo "Labels: $LABELS"

            HAS_BUG=$(echo "$LABELS" | grep -i "^bug$" || true)

            if [ -n "$HAS_BUG" ]; then
              WORD="Fixes"
            else
              WORD="Closes"
            fi

            echo "Selected word: $WORD"

            # Entries are comma separated and the suffix is never terminated, so a title
            # ends "Closes #123" and several linked issues give "Closes #1, Closes #2".
            # The keyword is repeated on every entry rather than shared ("Closes #1, #2")
            # because the keyword is chosen per issue from its labels, so a mixed set has
            # to be expressible: "Fixes #5, Closes #6".
            if [ -z "$SUFFIX" ]; then
              SUFFIX="$WORD #$NUMBER"
            else
              SUFFIX="$SUFFIX, $WORD #$NUMBER"
            fi
          done

          # Trim spaces
          SUFFIX=$(echo $SUFFIX | xargs)

          echo "Final computed suffix: '$SUFFIX'"

          echo "suffix=$SUFFIX" >> $GITHUB_OUTPUT

          echo "Step output written:"
          cat $GITHUB_OUTPUT

      - name: Update PR title
        if: steps.graphql.outputs.suffix != ''
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const suffix = "${{ steps.graphql.outputs.suffix }}";

            let title = pr.title;

            // Remove any existing "Fixes #123" / "Closes #123" suffix so it is replaced
            // rather than appended to.
            //
            // Both the punctuation before an entry and the punctuation after it are
            // optional and may be a period or a comma. That covers every form this
            // workflow has ever written - ". Closes #1." from the original version,
            // ". Closes #1" and ". Closes #1. Closes #2" from later ones, and
            // ", Closes #2" from the current comma-separated form. Requiring a trailing
            // period is what made the suffix accumulate instead of being replaced.
            title = title.replace(/([.,]\s*)?(Fixes|Closes|Resolves)\s+#\d+[.,]?\s*/gi, "").trim();

            // A trailing separator can survive when the statement itself ended in one.
            title = title.replace(/[.,]\s*$/, "").trim();

            // Ensure base title ends with a single period
            if (!title.endsWith(".")) {
              title = title + ".";
            }

            const newTitle = `${title} ${suffix}`
              .replace(/\s+/g, " ")
              .trim();

            if (pr.title !== newTitle) {
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                title: newTitle
              });

              console.log(`Updated title: ${newTitle}`);
            } else {
              console.log("Title already correct.");
            }
