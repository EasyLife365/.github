name: Dotnet Build & Test (Azure)

# Split out of ci_dotnet.yml so that workflow could drop id-token: write entirely and safely
# accept a caller-supplied checkout-ref for Dependabot/Renovate PRs (see EasyLife365/.github-
# private#158). id-token: write cannot be made conditional on an input -- a reusable workflow's
# permissions are requested once, statically, for the whole file -- so a single file offering
# both "run against untrusted checkout-ref content" and "sign in to Azure via OIDC" would expose
# an OIDC-minting credential to whatever code runs once checkout-ref makes that untrusted content
# real. This file keeps the Azure capability and NEVER accepts checkout-ref: it is for a caller's
# ordinary push/pull_request path only, exactly as ci_dotnet.yml behaved before that split. A
# caller that needs both -- Azure-backed tests on its normal PR path, and Dependabot/Renovate
# support on the bot path -- calls this file for the former and ci_dotnet.yml for the latter, as
# two separate jobs gated by actor, the same way a single job would gate between pull_request and
# pull_request_target.

on:
  workflow_call:

    inputs:
      dotnet-version:
        required: false
        type: string
        default: '9.x'

      use-azurite:
        required: false
        type: boolean
        default: false

      add-function-core-tools:
        required: false
        type: boolean
        default: false

      project-name:
        required: false
        type: string

      build-properties:
        description: 'Extra MSBuild properties appended to the build invocation verbatim, e.g. "/p:DefineConstants=SOME_FLAG". For a caller that needs different compile-time behavior per trigger (e.g. a live-mode build only on push to main, a mock-mode build otherwise) -- compute the right value at the call site and pass it here rather than adding trigger-specific logic to this file. Leave empty for none.'
        required: false
        type: string
        default: ''

      test-filter:
        required: false
        type: string
        default: ''

      allow-zero-tests:
        description: 'Treat zero discovered/matched tests as warning instead of failure'
        required: false
        type: boolean
        default: false

      use-mtp-logging:
        description: 'Use MTP-native --report-trx instead of --logger trx (required for xunit v3 / .NET 10+)'
        required: false
        type: boolean
        default: false

      xunit-native-trx:
        description: '--report-xunit-trx instead of --report-trx/--logger trx: xunit v3''s OWN TRX reporter. Needed when a project has no Microsoft.Testing.Extensions.TrxReport package -- that package is what --report-trx (use-mtp-logging) requires, and without it dotnet test rejects the option and reports "Zero tests ran" (exit code 5), which looks like a passing run with nothing in it rather than the wrong flag. Takes precedence over use-mtp-logging when both are true.'
        required: false
        type: boolean
        default: false

      test-filter-query:
        description: 'Microsoft.Testing.Platform native query syntax, e.g. "/*/*Unit*/*/*". A project on xunit v3 / MTP selects tests this way, not with the classic VSTest --filter expression test-filter passes -- the two are different syntaxes for different runners, not two spellings of the same thing. Applied in addition to test-filter when both are set.'
        required: false
        type: string
        default: ''

      ignore-exit-code:
        description: 'Passed as --ignore-exit-code <value> to dotnet test, e.g. 8 -- the code Microsoft.Testing.Platform returns when a project has zero tests matching a filter. Set this when that is expected for some projects in the solution (an integration-only project excluded by a unit-test filter) rather than a failure to catch.'
        required: false
        type: string
        default: ''

      free-disk-space:
        description: 'Deletes unused preinstalled toolsets (Android SDK, GHC, Boost, Swift, the CodeQL cache) in the background while restore and build proceed, freeing roughly 20 GB. For a solution whose Release output does not fit in the runner''s ~13 GB free by default.'
        required: false
        type: boolean
        default: false

      use-test-logger:
        description: 'Attach test logger arguments (disable for MTP setups that fail when logger args are present)'
        required: false
        type: boolean
        default: true

      run-tests:
        description: 'Whether to run tests (set to false to only build)'
        required: false
        type: boolean
        default: true

      upload-artifacts:
        description: 'Whether to upload build artifacts'
        required: false
        type: boolean
        default: false

      artifacts-path:
        description: 'Path to publish artifacts (relative to repo root, e.g. ./published)'
        required: false
        type: string
        default: './published'

      artifact-name:
        description: 'Name of the artifact to upload (optional)'
        required: false
        type: string
        default: ''

      artifact-retention-days:
        description: 'Number of days to retain artifacts'
        required: false
        type: number
        default: 15

      azure-login:
        description: 'Sign in to Azure with OIDC before the test step, so fixtures can resolve @Microsoft.KeyVault(SecretUri=...) references out of their configuration. Identity comes from the CI_AADAPPID / TENANTID / SUBSCRIPTIONID variables unless overridden by the inputs below.'
        required: false
        type: boolean
        default: false

      azure-client-id:
        description: 'Override for the Entra application (client) id. Leave empty to use the CI_AADAPPID variable, which resolves against the CALLING repository and so can be set once at organization scope.'
        required: false
        type: string
        default: ''

      azure-tenant-id:
        description: 'Override for the Entra tenant id. Leave empty to use the TENANTID variable.'
        required: false
        type: string
        default: ''

      azure-subscription-id:
        description: 'Optional. Override for the Azure subscription id. Leave empty to use the SUBSCRIPTIONID variable, or leave both empty: Key Vault data-plane calls are not subscription-scoped, and the sign-in then runs with allow-no-subscriptions.'
        required: false
        type: string
        default: ''

    secrets:
      PACKAGE-TOKEN:
        required: true

# EVERY CALLER MUST GRANT ALL FOUR OF THESE, or none at all -- see ci_dotnet.yml's own comment for
# why a partial block is worse than none. id-token: write lives ONLY in this file, never in
# ci_dotnet.yml, specifically so that file can safely accept checkout-ref (real Dependabot/Renovate
# PR content) without an OIDC-minting credential being present for whatever code that content
# brings with it. Never add checkout-ref support to this file.
permissions:
  checks: write
  contents: read
  pull-requests: write
  id-token: write

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # Runs detached so restore and build proceed while it works. Ported from EasyLife365-
      # Collaboration's repository-local job, which needed this because the Release output of a
      # 42-project solution (~7.8 GB) does not fit in the runner's ~13 GB free by default -- see
      # EasyLife365/.github#100.
      - name: Free disk space (background)
        if: ${{ inputs.free-disk-space }}
        run: |
          df -h / | tail -1
          sudo setsid nohup bash -c 'rm -rf /usr/local/lib/android /opt/ghc /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache/CodeQL /usr/local/.ghcup; docker image prune -af' > /dev/null 2>&1 &

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install dependencies
        run: |
          if [ -z "${{ inputs.project-name }}" ]; then
            echo "Restoring all projects..."
            dotnet restore
          else
            echo "Restoring project: ${{ inputs.project-name }}"
            dotnet restore "${{ inputs.project-name }}"
          fi
        env:
          GITHUB_PACKAGE_TOKEN: ${{ secrets.PACKAGE-TOKEN }}

      - name: Build
        env:
          # GitHub Actions substitutes ${{ }} into the script text before bash ever parses it, so
          # quoting the substitution itself (e.g. BUILD_PROPERTIES="${{ inputs.build-properties }}")
          # does not make it shell-safe -- a value containing an unescaped `"` breaks out of that
          # assignment regardless. Routing through env: makes the runtime, not text substitution,
          # responsible for getting the value into the shell.
          BUILD_PROPERTIES: ${{ inputs.build-properties }}
        run: |
          if [ -z "${{ inputs.project-name }}" ]; then
            echo "Building all projects..."
            dotnet build --configuration Release --no-restore $BUILD_PROPERTIES
          else
            echo "Building project: ${{ inputs.project-name }}"
            dotnet build "${{ inputs.project-name }}" --configuration Release --no-restore $BUILD_PROPERTIES
          fi

      - name: Publish
        if: ${{ inputs.upload-artifacts }}
        run: |
          if [ -z "${{ inputs.project-name }}" ]; then
            echo "::error::project-name is required when upload-artifacts is true."
            exit 1
          fi
          echo "Publishing project: ${{ inputs.project-name }}"
          dotnet publish "${{ inputs.project-name }}" --configuration Release --no-build --output "${{ inputs.artifacts-path }}"

      - name: Setup Node.js environment
        if: ${{ inputs.use-azurite && inputs.run-tests }}
        uses: actions/setup-node@v4

      # apt, not npm: the npm registry install 401s on any caller whose own setup (a prior
      # actions/setup-node with registry-url, or an .npmrc committed for its own package
      # installs) has pointed npm's default registry at GitHub Packages instead of npmjs.org --
      # azure-functions-core-tools was never published there. Confirmed happening for real on
      # EasyLife365-Notification since 2026-08-27; confirmed NOT reproducing on every caller (the
      # plain npm install still succeeds where nothing has touched the npm registry config), which
      # is exactly why it looked fine here for a while. apt has no such dependency on the calling
      # job's own npm state, so this is a strict improvement rather than a caller-specific carve-out.
      - name: Install Azure Functions Core Tools
        if: ${{ inputs.add-function-core-tools && inputs.run-tests }}
        run: |
          if ! grep -rqs "packages.microsoft.com" /etc/apt/sources.list.d/; then
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/microsoft.gpg > /dev/null
            echo "deb [arch=amd64] https://packages.microsoft.com/repos/microsoft-ubuntu-$(lsb_release -cs)-prod $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/microsoft-prod.list > /dev/null
          fi
          sudo apt-get update
          sudo apt-get install -y azure-functions-core-tools-4
          func --version

      - name: Install Azurite
        if: ${{ inputs.use-azurite && inputs.run-tests }}
        run: npm install -g azurite
        env:
          GITHUB_PACKAGE_TOKEN: ${{ secrets.PACKAGE-TOKEN }}

      - name: Run Azurite in Background
        if: ${{ inputs.use-azurite && inputs.run-tests }}
        shell: bash
        run: azurite --skipApiVersionCheck &

      - name: Check Azure sign-in inputs
        if: ${{ inputs.azure-login && inputs.run-tests }}
        shell: bash
        run: |
          missing=""
          if [ -z "${{ inputs.azure-client-id || vars.CI_AADAPPID }}" ]; then missing="$missing CI_AADAPPID"; fi
          if [ -z "${{ inputs.azure-tenant-id || vars.TENANTID }}" ]; then missing="$missing TENANTID"; fi
          if [ -n "$missing" ]; then
            echo "::error::azure-login is true but these are empty:$missing."
            echo "::error::Set them once as ORGANIZATION variables and scope them to this repository."
            echo "::error::A variable scoped to a GitHub environment does not resolve here: the test job"
            echo "::error::deliberately joins no environment, so that pull requests are not gated by"
            echo "::error::deployment protection rules. Organization or repository scope, not environment."
            exit 1
          fi
          if [ -z "${{ inputs.azure-subscription-id || vars.SUBSCRIPTIONID }}" ]; then
            echo "No subscription id configured; signing in with allow-no-subscriptions."
            echo "That is expected: Key Vault data-plane calls are not subscription-scoped, and"
            echo "the Key Vault roles carry only dataActions, so this principal may see none."
          fi

      - name: Azure login
        if: ${{ inputs.azure-login && inputs.run-tests }}
        uses: azure/login@v2
        with:
          # vars resolves against the CALLING repository, so one organization variable
          # serves every caller and no identity is repeated per repository.
          client-id: ${{ inputs.azure-client-id || vars.CI_AADAPPID }}
          tenant-id: ${{ inputs.azure-tenant-id || vars.TENANTID }}
          subscription-id: ${{ inputs.azure-subscription-id || vars.SUBSCRIPTIONID }}
          # Without this, az login fails when the principal can enumerate no subscription --
          # which is the normal case here, since the Key Vault roles grant dataActions only.
          allow-no-subscriptions: ${{ (inputs.azure-subscription-id || vars.SUBSCRIPTIONID) == '' }}

      - name: Test
        if: ${{ inputs.run-tests }}
        env:
          # Routed through env: rather than hoisted with VAR="${{ inputs.x }}" -- that quoting does
          # not make the substitution shell-safe, since GitHub Actions splices the value into the
          # script text before bash parses it. Reachable only by a caller's own workflow YAML
          # (test-filter/test-filter-query/ignore-exit-code are with:-supplied literals, never PR
          # content), but worth closing since a caller-side mistake or a future less-trusted caller
          # shouldn't depend on this file's own hoisting for safety.
          TEST_FILTER: ${{ inputs.test-filter }}
          FILTER_QUERY: ${{ inputs.test-filter-query }}
          IGNORE_EXIT_CODE: ${{ inputs.ignore-exit-code }}
        run: |
          ALLOW_ZERO_TESTS="${{ inputs.allow-zero-tests }}"
          FILTER_ARGS=()
          IGNORE_EXIT_CODE_ARGS=()
          FAILED=0

          is_zero_test_output() {
            local output="$1"
            echo "$output" | grep -Eiq "Zero tests ran|No test matches the given testcase filter|No test is available in|No tests were found"
          }

          if [ "${{ inputs.use-test-logger }}" = "true" ]; then
            if [ "${{ inputs.xunit-native-trx }}" = "true" ]; then
              LOGGER_ARGS=(--report-xunit-trx --results-directory ./TestResults)
            elif [ "${{ inputs.use-mtp-logging }}" = "true" ]; then
              LOGGER_ARGS=(--report-trx --results-directory ./TestResults)
            else
              LOGGER_ARGS=(--logger trx --results-directory ./TestResults)
            fi
          else
            LOGGER_ARGS=(--results-directory ./TestResults)
          fi

          # test-filter-query (MTP's own query syntax) and test-filter (classic VSTest) select
          # tests in unrelated ways, not two spellings of the same flag -- both can be set at once
          # for a caller mixing runner generations across projects.
          if [ -n "$FILTER_QUERY" ]; then
            echo "Using filter query: $FILTER_QUERY"
            FILTER_ARGS+=(--filter-query "$FILTER_QUERY")
          fi
          if [ -n "$TEST_FILTER" ]; then
            echo "Using test filter: $TEST_FILTER"
            FILTER_ARGS+=(--filter "$TEST_FILTER")
          fi
          if [ -z "$FILTER_QUERY" ] && [ -z "$TEST_FILTER" ]; then
            echo "No test filter provided. Running all tests."
          fi

          if [ -n "$IGNORE_EXIT_CODE" ]; then
            IGNORE_EXIT_CODE_ARGS=(--ignore-exit-code "$IGNORE_EXIT_CODE")
          fi

          set +e
          if [ -z "${{ inputs.project-name }}" ]; then
            echo "Discovering test projects..."
            mapfile -t TEST_PROJECTS < <(find . -iname "*test*.csproj" | sort)

            if [ ${#TEST_PROJECTS[@]} -eq 0 ]; then
              echo "::error::No test projects found."
              exit 1
            fi

            echo "Found ${#TEST_PROJECTS[@]} test project(s):"
            printf '  %s\n' "${TEST_PROJECTS[@]}"
            echo ""

            for PROJECT in "${TEST_PROJECTS[@]}"; do
              echo "::group::Testing $PROJECT"
              # tee, rather than output=$(...) echoed afterwards. Capturing the whole run means no
              # live output, and it arrives as one undifferentiated block that
              # `gh run view --log-failed` then returns in full, setup noise included. PIPESTATUS
              # keeps dotnet's exit code rather than tee's.
              LOG=$(mktemp)
              dotnet test "$PROJECT" --no-restore --verbosity normal "${LOGGER_ARGS[@]}" "${FILTER_ARGS[@]}" "${IGNORE_EXIT_CODE_ARGS[@]}" 2>&1 | tee "$LOG"
              exit_code=${PIPESTATUS[0]}
              output=$(cat "$LOG")
              rm -f "$LOG"
              echo "::endgroup::"
              if [ $exit_code -ne 0 ]; then
                if [ "$ALLOW_ZERO_TESTS" = "true" ] && is_zero_test_output "$output"; then
                  echo "::warning::Zero tests ran for $PROJECT; continuing."
                else
                  echo "::warning::Tests failed in $PROJECT"
                  FAILED=1
                fi
              fi
              echo ""
            done

            if [ $FAILED -ne 0 ]; then
              echo "::error::One or more test projects failed."
              exit 1
            fi
          else
            echo "::group::Testing ${{ inputs.project-name }}"
            LOG=$(mktemp)
            dotnet test "${{ inputs.project-name }}" --no-restore --verbosity normal "${LOGGER_ARGS[@]}" "${FILTER_ARGS[@]}" "${IGNORE_EXIT_CODE_ARGS[@]}" 2>&1 | tee "$LOG"
            exit_code=${PIPESTATUS[0]}
            output=$(cat "$LOG")
            rm -f "$LOG"
            echo "::endgroup::"
            if [ $exit_code -ne 0 ]; then
              if [ "$ALLOW_ZERO_TESTS" = "true" ] && is_zero_test_output "$output"; then
                echo "::warning::Zero tests ran for ${{ inputs.project-name }}; continuing."
              else
                echo "::error::Tests failed in ${{ inputs.project-name }}"
                exit 1
              fi
            fi
          fi
          set -e

      # Runs even when the tests failed -- especially then. Without this the run page says nothing
      # at all about which test failed, and the only route to the answer is opening the log and
      # scrolling past restore, build and setup.
      - name: Checkout shared test summary script
        if: ${{ always() && inputs.run-tests }}
        uses: actions/checkout@v4
        with:
          repository: EasyLife365/.github
          ref: main
          path: .shared-github
          token: ${{ secrets.GITHUB_PACKAGE_TOKEN || github.token }}
          persist-credentials: false
          sparse-checkout: |
            scripts/test-summary.mjs

      - name: Summarise test results
        if: ${{ always() && inputs.run-tests }}
        shell: bash
        run: |
          node .shared-github/scripts/test-summary.mjs ./TestResults \
            --title "${{ inputs.project-name != '' && inputs.project-name || github.event.repository.name }}"

      # Keep the TRX. It is what makes two runs comparable -- which tests were executed then and
      # are not now -- and after the run the logs alone cannot answer that.
      - name: Upload test results
        if: ${{ always() && inputs.run-tests }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.job }}-${{ github.run_attempt }}
          path: TestResults/*.trx
          retention-days: 14
          if-no-files-found: ignore

      # Deliberately not gated on use-test-logger. That input turns off *logger arguments* for MTP
      # runners that reject them; those runners still write TRX, and gating the publish on it left
      # repositories that set it false -- Mail's live suite among them -- with no check run at all.
      # if-no-files-found on the action's own `files` glob handles the case where none were written.
      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: ${{ always() && inputs.run-tests }}
        continue-on-error: true
        with:
          files: |
            TestResults/*.trx
          action_fail: false

      - name: Upload artifacts
        if: ${{ inputs.upload-artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name != '' && inputs.artifact-name || github.event.repository.name }}
          path: ${{ inputs.artifacts-path }}
          retention-days: ${{ inputs.artifact-retention-days }}
          include-hidden-files: true
